// =========================================================
// PPTX IMPORT
// Converts .pptx (OOXML) to EP Presenter slide format.
// Uses JSZip for archive extraction + DOMParser for XML.
// =========================================================

// EMU (English Metric Unit) to pixel conversion.
// PowerPoint uses EMU internally: 914400 EMU = 1 inch = 96 pixels.
// We scale to match our STAGE_W (1440px for 16:9 standard widescreen).
// Standard PPT slide is 9144000 × 6858000 EMU (10" × 7.5") or
// 12192000 × 6858000 EMU (13.33" × 7.5") for 16:9.
// We'll detect actual slide size from presentation.xml and scale to our stage.
var PPTX_SLIDE_W_EMU = 9144000;  // fallback; will be read from file
var PPTX_SLIDE_H_EMU = 6858000;  // fallback

function emuToPxX(emu){ return (emu / PPTX_SLIDE_W_EMU) * STAGE_W; }
function emuToPxY(emu){ return (emu / PPTX_SLIDE_H_EMU) * STAGE_H; }

// PPTX stores font sizes in hundredths of a point (sz="2400" = 24pt).
// 1pt = 1.333px at 96dpi. Scale a bit to account for our larger stage if needed.
function pptxSzToPx(sz){
  if(!sz) return 18;
  var pt = parseInt(sz) / 100;
  return Math.round(pt * 1.333);
}

// Normalize a hex color string; PPTX uses uppercase 6-char hex without #.
function pptxHex(hexStr){
  if(!hexStr) return null;
  var clean = String(hexStr).replace('#','').toLowerCase();
  if(clean.length === 6) return '#'+clean;
  if(clean.length === 8) return '#'+clean.slice(0,6); // strip alpha
  return null;
}

// Extract solid fill color from a spPr node. Falls back through srgbClr, schemeClr.
// schemeClr requires theme lookup which we skip — defaults to null.
function pptxExtractSolidColor(node){
  if(!node) return null;
  var solid = node.querySelector(':scope > a\\:solidFill, solidFill');
  if(!solid) return null;
  var srgb = solid.querySelector('srgbClr');
  if(srgb) return pptxHex(srgb.getAttribute('val'));
  // schemeClr: theme-mapped, we'll fallback
  var scheme = solid.querySelector('schemeClr');
  if(scheme){
    var val = scheme.getAttribute('val');
    var themeColors = {
      'bg1':'#ffffff', 'tx1':'#000000', 'bg2':'#f2f2f2', 'tx2':'#1a1a1a',
      'accent1':'#7ed957','accent2':'#ffa500','accent3':'#3b82f6',
      'accent4':'#a855f7','accent5':'#ec4899','accent6':'#f43f5e',
      'lt1':'#ffffff','dk1':'#000000','lt2':'#f2f2f2','dk2':'#1a1a1a'
    };
    return themeColors[val] || null;
  }
  return null;
}

// Extract position + size (x, y, w, h in px) from an spPr node.
function pptxExtractXfrm(spPr){
  if(!spPr) return null;
  var xfrm = spPr.querySelector('xfrm');
  if(!xfrm) return null;
  var off = xfrm.querySelector('off');
  var ext = xfrm.querySelector('ext');
  if(!off || !ext) return null;
  return {
    x: emuToPxX(parseInt(off.getAttribute('x') || 0)),
    y: emuToPxY(parseInt(off.getAttribute('y') || 0)),
    w: emuToPxX(parseInt(ext.getAttribute('cx') || 0)),
    h: emuToPxY(parseInt(ext.getAttribute('cy') || 0))
  };
}

// Extract text content from a <p:txBody>. Returns { text, fs, fw, color, align }.
// Handles multiple runs, picks dominant formatting from first run.
function pptxExtractText(txBody){
  if(!txBody) return null;
  var paragraphs = txBody.querySelectorAll(':scope > a\\:p, p');
  if(!paragraphs.length) return null;
  var lines = [];
  var dominantFs = null, dominantFw = null, dominantColor = null, dominantAlign = null;
  for(var pi=0; pi<paragraphs.length; pi++){
    var p = paragraphs[pi];
    // Paragraph alignment
    var pPr = p.querySelector('pPr');
    var algn = pPr ? pPr.getAttribute('algn') : null;
    if(algn && !dominantAlign){
      dominantAlign = algn === 'ctr' ? 'center' : algn === 'r' ? 'right' : 'left';
    }
    var runs = p.querySelectorAll('r');
    var lineText = '';
    runs.forEach(function(r){
      var tNode = r.querySelector('t');
      var t = tNode ? tNode.textContent : '';
      lineText += t;
      // Capture style from first run
      var rPr = r.querySelector('rPr');
      if(rPr && dominantFs === null){
        var sz = rPr.getAttribute('sz');
        if(sz) dominantFs = pptxSzToPx(sz);
        var b = rPr.getAttribute('b');
        if(b === '1') dominantFw = '700';
        else if(!dominantFw) dominantFw = '400';
        var solid = rPr.querySelector('solidFill > srgbClr');
        if(solid) dominantColor = pptxHex(solid.getAttribute('val'));
      }
    });
    // If no runs, try direct text
    if(!runs.length){
      var directT = p.querySelector('t');
      if(directT) lineText = directT.textContent;
    }
    lines.push(lineText);
  }
  var fullText = lines.filter(function(s){return s.length>0}).join('\n');
  if(!fullText.trim()) return null;
  return {
    text: fullText,
    fs: dominantFs || 18,
    fw: dominantFw || '400',
    color: dominantColor || '#f0f0f5',
    align: dominantAlign || 'left'
  };
}

// Convert a single <p:sp> shape node to one or more EP elements.
function pptxConvertShape(sp, imageMap){
  var spPr = sp.querySelector(':scope > spPr, spPr');
  var txBody = sp.querySelector(':scope > txBody, txBody');
  var nvSpPr = sp.querySelector('nvSpPr');
  var isTextBox = nvSpPr && nvSpPr.querySelector('cNvSpPr[txBox="1"]');
  var xfrm = pptxExtractXfrm(spPr);
  if(!xfrm) return [];

  // Determine preset geometry
  var prstGeom = spPr ? spPr.querySelector('prstGeom') : null;
  var prst = prstGeom ? prstGeom.getAttribute('prst') : 'rect';

  var fillColor = pptxExtractSolidColor(spPr);
  var hasText = txBody && txBody.textContent.trim().length > 0;

  var elements = [];

  // Case 1: Pure shape (rectangle, ellipse) with no text and a fill color
  if(!isTextBox && !hasText && fillColor){
    if(prst === 'rect' || prst === 'roundRect'){
      elements.push({
        id:uid(), type:'shape', shape:'rect',
        x:xfrm.x, y:xfrm.y, w:Math.max(10,xfrm.w), h:Math.max(10,xfrm.h),
        fill:fillColor, fillOp:1, stroke:fillColor, sw:0, lk:false
      });
      return elements;
    }
    if(prst === 'ellipse' || prst === 'circle' || prst === 'oval'){
      elements.push({
        id:uid(), type:'shape', shape:'circle',
        x:xfrm.x, y:xfrm.y, w:Math.max(10,xfrm.w), h:Math.max(10,xfrm.h),
        fill:fillColor, fillOp:1, stroke:fillColor, sw:0, lk:false
      });
      return elements;
    }
    // Unknown preset — fall back to rect
    elements.push({
      id:uid(), type:'shape', shape:'rect',
      x:xfrm.x, y:xfrm.y, w:Math.max(10,xfrm.w), h:Math.max(10,xfrm.h),
      fill:fillColor, fillOp:1, stroke:fillColor, sw:0, lk:false
    });
    return elements;
  }

  // Case 2: Text box (or shape with text)
  if(hasText){
    var txt = pptxExtractText(txBody);
    if(txt){
      elements.push({
        id:uid(), type:'text',
        x:xfrm.x, y:xfrm.y, w:Math.max(40,xfrm.w), h:Math.max(20,xfrm.h),
        text:txt.text, fs:txt.fs, fw:txt.fw, color:txt.color,
        bc:'transparent', bw:0, br:0,
        bg: fillColor || 'transparent',
        align: txt.align,
        vAlign: 'center',
        lk:false
      });
    }
    return elements;
  }

  return elements;
}

// Convert a <p:pic> image node.
function pptxConvertImage(pic, imageMap, slideRels){
  var spPr = pic.querySelector(':scope > spPr, spPr');
  var xfrm = pptxExtractXfrm(spPr);
  if(!xfrm) return null;
  var blipFill = pic.querySelector('blipFill');
  if(!blipFill) return null;
  var blip = blipFill.querySelector('blip');
  if(!blip) return null;
  var rId = blip.getAttribute('r:embed') || blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed');
  if(!rId) return null;
  var imgPath = slideRels[rId];
  if(!imgPath) return null;
  var dataUri = imageMap[imgPath];
  if(!dataUri) return null;
  return {
    id:uid(), type:'image',
    x:xfrm.x, y:xfrm.y, w:Math.max(40,xfrm.w), h:Math.max(40,xfrm.h),
    src:dataUri, bc:'transparent', bw:0, br:0, op:1, lk:false
  };
}

// Parse one slide XML into an EP slide object.
function pptxParseSlide(slideXml, imageMap, slideRels){
  var parser = new DOMParser();
  var doc = parser.parseFromString(slideXml, 'application/xml');
  // Background
  var bg = doc.querySelector('bg');
  var bgColor = '#111113'; // default dark
  if(bg){
    var bgColorExtracted = pptxExtractSolidColor(bg);
    if(bgColorExtracted) bgColor = bgColorExtracted;
  }
  var spTree = doc.querySelector('spTree');
  if(!spTree) return {id:uid(), bg:bgColor, els:[], draws:[]};

  var els = [];
  // Iterate children in document order so z-index matches PowerPoint
  var children = Array.from(spTree.children);
  children.forEach(function(child){
    var tag = child.tagName.split(':').pop();
    if(tag === 'sp'){
      var newEls = pptxConvertShape(child, imageMap);
      if(newEls && newEls.length) els = els.concat(newEls);
    } else if(tag === 'pic'){
      var imgEl = pptxConvertImage(child, imageMap, slideRels);
      if(imgEl) els.push(imgEl);
    }
    // cxnSp (connectors), graphicFrame (tables, charts), grpSp (groups) are skipped for now
  });
  return {id:uid(), bg:bgColor, els:els, draws:[]};
}

// Parse a slide's _rels file to map rIds to image paths.
function pptxParseSlideRels(relsXml){
  if(!relsXml) return {};
  var parser = new DOMParser();
  var doc = parser.parseFromString(relsXml, 'application/xml');
  var rels = doc.querySelectorAll('Relationship');
  var map = {};
  rels.forEach(function(r){
    var id = r.getAttribute('Id');
    var target = r.getAttribute('Target');
    if(id && target){
      // Target is like "../media/image1.png" — resolve to ppt/media/image1.png
      var resolved = target.replace(/^\.\.\//, 'ppt/');
      if(!resolved.startsWith('ppt/')) resolved = 'ppt/slides/' + resolved;
      map[id] = resolved;
    }
  });
  return map;
}

// Main import function: takes a .pptx File, returns array of EP slides.
async function pptxImport(file){
  if(typeof JSZip === 'undefined'){
    throw new Error('JSZip not loaded');
  }
  showToast('Opening .pptx...');
  var zip = await JSZip.loadAsync(file);

  // 1. Read presentation.xml for slide size
  var presXml = await zip.file('ppt/presentation.xml').async('string');
  var presDoc = new DOMParser().parseFromString(presXml, 'application/xml');
  var sldSz = presDoc.querySelector('sldSz');
  if(sldSz){
    var cx = parseInt(sldSz.getAttribute('cx'));
    var cy = parseInt(sldSz.getAttribute('cy'));
    if(cx && cy){
      PPTX_SLIDE_W_EMU = cx;
      PPTX_SLIDE_H_EMU = cy;
    }
  }

  // 2. Read presentation.xml.rels to find slide order
  var presRelsXml = await zip.file('ppt/_rels/presentation.xml.rels').async('string');
  var presRelsDoc = new DOMParser().parseFromString(presRelsXml, 'application/xml');
  var presRels = {};
  presRelsDoc.querySelectorAll('Relationship').forEach(function(r){
    presRels[r.getAttribute('Id')] = r.getAttribute('Target');
  });
  // sldIdLst gives order
  var sldIds = Array.from(presDoc.querySelectorAll('sldIdLst > sldId'));
  var slideFilePaths = [];
  sldIds.forEach(function(sid){
    var rId = sid.getAttribute('r:id') || sid.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    var target = presRels[rId];
    if(target){
      // e.g. "slides/slide1.xml" -> "ppt/slides/slide1.xml"
      slideFilePaths.push('ppt/' + target);
    }
  });

  // 3. Extract all images from ppt/media/ as data URIs
  var imageMap = {};
  var mediaFiles = [];
  zip.folder('ppt/media').forEach(function(path, f){
    if(!f.dir) mediaFiles.push('ppt/media/' + path);
  });
  for(var mi=0; mi<mediaFiles.length; mi++){
    var mp = mediaFiles[mi];
    var ext = mp.split('.').pop().toLowerCase();
    var mime = ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg' :
               ext === 'png' ? 'image/png' :
               ext === 'gif' ? 'image/gif' :
               ext === 'svg' ? 'image/svg+xml' :
               ext === 'webp' ? 'image/webp' : 'application/octet-stream';
    var b64 = await zip.file(mp).async('base64');
    imageMap[mp] = 'data:'+mime+';base64,'+b64;
  }

  // 4. Process each slide in order
  var newSlides = [];
  for(var si=0; si<slideFilePaths.length; si++){
    var sp = slideFilePaths[si];
    var slideXml = await zip.file(sp).async('string');
    // Find rels for this slide
    var relsPath = sp.replace(/\/([^\/]+)$/, '/_rels/$1.rels');
    var slideRels = {};
    var relsFile = zip.file(relsPath);
    if(relsFile){
      var relsXml = await relsFile.async('string');
      slideRels = pptxParseSlideRels(relsXml);
    }
    var slide = pptxParseSlide(slideXml, imageMap, slideRels);
    newSlides.push(slide);
  }

  return newSlides;
}

window.handlePptxImport = async function(evt){
  var f = evt.target.files && evt.target.files[0];
  if(!f) return;
  evt.target.value = '';
  if(!f.name.toLowerCase().endsWith('.pptx')){
    showToast('Please select a .pptx file');
    return;
  }
  try {
    var imported = await pptxImport(f);
    if(!imported || !imported.length){
      showToast('No slides found in file');
      return;
    }
    // Ask user: replace current or append?
    var choice = confirm('Import ' + imported.length + ' slide' + (imported.length>1?'s':'') + '?\n\nClick OK to REPLACE current deck.\nClick Cancel to APPEND to existing deck.');
    if(choice){
      S.slides = imported;
      S.si = 0;
    } else {
      S.slides = S.slides.concat(imported);
      S.si = S.slides.length - imported.length;
    }
    S.selIds = [];
    S.ed = null;
    pushHist();
    render();
    showToast('Imported ' + imported.length + ' slide' + (imported.length>1?'s':''));
  } catch(e){
    console.error('PPTX import failed:', e);
    showToast('Import failed: ' + e.message);
  }
};

// Render a single slide to a canvas (shared between PNG, PDF, PPTX exports)
async function renderSlideToCanvas(s, scale){
  scale = scale || 2;
  var cv = document.createElement('canvas');
  cv.width = STAGE_W * scale;
  cv.height = STAGE_H * scale;
  var x = cv.getContext('2d');
  x.scale(scale, scale);
  x.fillStyle = s.bg;
  x.fillRect(0, 0, STAGE_W, STAGE_H);
  for(var i=0; i<s.els.length; i++){
    var el = s.els[i];
    if(el.type === 'text'){
      if(el.bg && el.bg !== 'transparent'){
        x.fillStyle = el.bg;
        x.fillRect(el.x, el.y, el.w, el.h);
      }
      if(el.bw){
        x.strokeStyle = el.bc;
        x.lineWidth = el.bw;
        x.strokeRect(el.x, el.y, el.w, el.h);
      }
      x.fillStyle = el.color;
      x.font = el.fw + ' ' + el.fs + 'px Outfit';
      var hA = el.align || 'center';
      var vA = el.vAlign || 'center';
      var textX, textY;
      if(hA === 'left'){ x.textAlign = 'left'; textX = el.x + 14; }
      else if(hA === 'right'){ x.textAlign = 'right'; textX = el.x + el.w - 14; }
      else { x.textAlign = 'center'; textX = el.x + el.w/2; }
      if(vA === 'top'){ x.textBaseline = 'top'; textY = el.y + 10; }
      else if(vA === 'bottom'){ x.textBaseline = 'bottom'; textY = el.y + el.h - 10; }
      else { x.textBaseline = 'middle'; textY = el.y + el.h/2; }
      var lines = (el.text || '').split('\n');
      var lineH = el.fs * 1.3;
      var startY = textY - (lines.length - 1) * lineH / 2;
      if(vA === 'top') startY = textY;
      if(vA === 'bottom') startY = textY - (lines.length - 1) * lineH;
      lines.forEach(function(ln, li){
        x.fillText(ln, textX, startY + li * lineH, el.w - 28);
      });
    }
    if(el.type === 'line'){
      x.strokeStyle = el.stroke;
      x.lineWidth = el.sw;
      x.lineCap = 'round';
      x.beginPath();
      x.moveTo(el.x1, el.y1);
      x.lineTo(el.x2, el.y2);
      x.stroke();
      if(el.arrow){
        var ang = Math.atan2(el.y2-el.y1, el.x2-el.x1);
        x.fillStyle = el.stroke;
        x.beginPath();
        x.moveTo(el.x2, el.y2);
        x.lineTo(el.x2 - 16*Math.cos(ang-0.4), el.y2 - 16*Math.sin(ang-0.4));
        x.lineTo(el.x2 - 16*Math.cos(ang+0.4), el.y2 - 16*Math.sin(ang+0.4));
        x.closePath();
        x.fill();
      }
    }
    if(el.type === 'note'){
      x.fillStyle = el.bg;
      x.fillRect(el.x, el.y, el.w, el.h);
      x.fillStyle = '#1a1a1a';
      x.font = '500 14px Outfit';
      x.textAlign = 'left';
      var noteLines = (el.text || '').split('\n');
      for(var nli=0; nli<noteLines.length; nli++) x.fillText(noteLines[nli], el.x + 12, el.y + 24 + nli*20, el.w - 20);
    }
    if(el.type === 'shape'){
      x.strokeStyle = el.stroke;
      x.fillStyle = el.fill;
      x.lineWidth = el.sw;
      var shFop = el.fillOp != null ? el.fillOp : 1;
      if(el.shape === 'rect'){
        if(el.fill !== 'transparent'){ x.globalAlpha = shFop; x.fillRect(el.x, el.y, el.w, el.h); x.globalAlpha = 1; }
        if(el.sw > 0) x.strokeRect(el.x, el.y, el.w, el.h);
      } else if(el.shape === 'circle'){
        x.beginPath();
        x.ellipse(el.x + el.w/2, el.y + el.h/2, el.w/2, el.h/2, 0, 0, Math.PI*2);
        if(el.fill !== 'transparent'){ x.globalAlpha = shFop; x.fill(); x.globalAlpha = 1; }
        if(el.sw > 0) x.stroke();
      }
    }
    if(el.type === 'image'){
      try {
        var img = new Image();
        img.src = el.src;
        await new Promise(function(r){ img.onload = r; img.onerror = r; });
        x.globalAlpha = el.op || 1;
        x.drawImage(img, el.x, el.y, el.w, el.h);
        x.globalAlpha = 1;
      } catch(e){}
    }
    if(el.type === 'list'){
      try {
        // Ensure custom fonts are loaded before rasterizing (otherwise Outfit may fallback to serif and shift sizes)
        if(document.fonts && document.fonts.ready) await document.fonts.ready;

        var listHtml = renderList(el, true);
        // Wrap in xhtml-namespaced div, inline default dark background so transparent doesn't fall through
        var wrappedHtml =
          '<div xmlns="http://www.w3.org/1999/xhtml" style="font-family:\'Outfit\',sans-serif;width:'+el.w+'px;min-height:'+el.h+'px;color:#f0f0f5;box-sizing:border-box">' +
          listHtml +
          '</div>';
        // Build SVG with foreignObject. Use allowing overflow so content isn't clipped prematurely.
        var svgStr =
          '<svg xmlns="http://www.w3.org/2000/svg" width="'+el.w+'" height="'+el.h+'">' +
          '<foreignObject x="0" y="0" width="100%" height="100%" requiredExtensions="http://www.w3.org/1999/xhtml">' +
          wrappedHtml +
          '</foreignObject></svg>';
        // Use data URI (base64) instead of blob URL — more reliable for SVG rasterization across Chromium versions
        var encoded = encodeURIComponent(svgStr)
          .replace(/'/g,'%27').replace(/"/g,'%22');
        var dataUrl = 'data:image/svg+xml;charset=utf-8,' + encoded;
        var listImg = new Image();
        // Give browser time to decode; if it fails we fall through to catch
        await new Promise(function(resolve, reject){
          listImg.onload = function(){ resolve(); };
          listImg.onerror = function(e){ reject(new Error('SVG rasterize failed')); };
          listImg.src = dataUrl;
          // Safety timeout so we don't hang the whole render
          setTimeout(function(){ reject(new Error('SVG rasterize timeout')); }, 2000);
        }).catch(function(err){
          console.warn('[EP] List rasterize via SVG failed:', err, '— will use fallback');
          throw err;
        });
        x.drawImage(listImg, el.x, el.y, el.w, el.h);
      } catch(e){
        // Fallback: draw a readable visual so the list at least doesn't disappear in the output
        x.fillStyle = 'rgba(255,255,255,0.04)';
        x.fillRect(el.x, el.y, el.w, el.h);
        x.strokeStyle = '#7ed957';
        x.lineWidth = 2;
        x.strokeRect(el.x, el.y, el.w, el.h);
        // Render a simple text-only fallback for each item
        x.fillStyle = '#f0f0f5';
        x.font = '600 18px Outfit, sans-serif';
        x.textBaseline = 'top';
        x.textAlign = 'left';
        var items = el.items || [];
        var yOff = el.y + 20;
        for(var ii=0; ii<items.length && yOff < el.y + el.h - 10; ii++){
          var it = items[ii];
          var line = '';
          if(el.style === 'table'){
            line = (it.cells || []).join('  |  ');
          } else if(el.style === 'checklist'){
            line = (it.checked ? '☑ ' : '☐ ') + (it.text || '');
          } else {
            line = (it.title ? it.title + ' — ' : '') + (it.body || it.text || '');
          }
          // Naive truncation
          if(line.length > 90) line = line.substring(0, 87) + '...';
          x.fillText(line, el.x + 16, yOff, el.w - 32);
          yOff += 28;
        }
      }
    }
    if(el.type === 'screenshare'){
      // Draw the live video if connected, else draw a styled placeholder
      var ssStream = _screenShareStreams[el.id];
      var ssVideo = ssStream ? document.getElementById('ss-video-' + el.id) : null;
      // Background
      x.fillStyle = '#0a0a0c';
      x.fillRect(el.x, el.y, el.w, el.h);
      // Border (accounting for border radius by clipping if non-zero)
      var ssBr = el.br || 10;
      if(ssVideo && ssVideo.readyState >= 2){
        try {
          x.save();
          if(ssBr > 0){
            // Rounded clip
            x.beginPath();
            var r = Math.min(ssBr, el.w/2, el.h/2);
            x.moveTo(el.x + r, el.y);
            x.lineTo(el.x + el.w - r, el.y);
            x.quadraticCurveTo(el.x + el.w, el.y, el.x + el.w, el.y + r);
            x.lineTo(el.x + el.w, el.y + el.h - r);
            x.quadraticCurveTo(el.x + el.w, el.y + el.h, el.x + el.w - r, el.y + el.h);
            x.lineTo(el.x + r, el.y + el.h);
            x.quadraticCurveTo(el.x, el.y + el.h, el.x, el.y + el.h - r);
            x.lineTo(el.x, el.y + r);
            x.quadraticCurveTo(el.x, el.y, el.x + r, el.y);
            x.closePath();
            x.clip();
          }
          x.drawImage(ssVideo, el.x, el.y, el.w, el.h);
          x.restore();
        } catch(e){}
      } else {
        // Placeholder
        x.fillStyle = '#1a1a22';
        x.fillRect(el.x, el.y, el.w, el.h);
        x.fillStyle = '#66667a';
        x.font = '500 18px Outfit, sans-serif';
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        x.fillText(el.label || 'Screen Share (not connected)', el.x + el.w/2, el.y + el.h/2);
      }
      // Border
      if(el.bw > 0){
        x.strokeStyle = el.bc || '#7ed957';
        x.lineWidth = el.bw;
        // Draw rounded rect border if radius > 0
        if(ssBr > 0){
          var rb = Math.min(ssBr, el.w/2, el.h/2);
          x.beginPath();
          x.moveTo(el.x + rb, el.y);
          x.lineTo(el.x + el.w - rb, el.y);
          x.quadraticCurveTo(el.x + el.w, el.y, el.x + el.w, el.y + rb);
          x.lineTo(el.x + el.w, el.y + el.h - rb);
          x.quadraticCurveTo(el.x + el.w, el.y + el.h, el.x + el.w - rb, el.y + el.h);
          x.lineTo(el.x + rb, el.y + el.h);
          x.quadraticCurveTo(el.x, el.y + el.h, el.x, el.y + el.h - rb);
          x.lineTo(el.x, el.y + rb);
          x.quadraticCurveTo(el.x, el.y, el.x + rb, el.y);
          x.closePath();
          x.stroke();
        } else {
          x.strokeRect(el.x, el.y, el.w, el.h);
        }
      }
    }
    if(el.type === 'webcam'){
      // Composite live camera feed onto recording canvas
      var wcStream = _webcamElStreams[el.id];
      var wcVideo = wcStream ? document.getElementById('wc-video-' + el.id) : null;
      var wcShape = el.shape || 'circle';
      var wcMirror = el.mirror !== false;
      // Background fill (so even disconnected we get a visible shape)
      x.fillStyle = '#0a0a0c';
      // Determine clip path based on shape
      x.save();
      x.beginPath();
      if(wcShape === 'circle'){
        var cx = el.x + el.w/2, cy = el.y + el.h/2;
        var rad = Math.min(el.w, el.h) / 2;
        x.arc(cx, cy, rad, 0, Math.PI*2);
      } else if(wcShape === 'rounded'){
        var wcBr = Math.min(el.br || 14, el.w/2, el.h/2);
        x.moveTo(el.x + wcBr, el.y);
        x.lineTo(el.x + el.w - wcBr, el.y);
        x.quadraticCurveTo(el.x + el.w, el.y, el.x + el.w, el.y + wcBr);
        x.lineTo(el.x + el.w, el.y + el.h - wcBr);
        x.quadraticCurveTo(el.x + el.w, el.y + el.h, el.x + el.w - wcBr, el.y + el.h);
        x.lineTo(el.x + wcBr, el.y + el.h);
        x.quadraticCurveTo(el.x, el.y + el.h, el.x, el.y + el.h - wcBr);
        x.lineTo(el.x, el.y + wcBr);
        x.quadraticCurveTo(el.x, el.y, el.x + wcBr, el.y);
        x.closePath();
      } else {
        x.rect(el.x, el.y, el.w, el.h);
      }
      x.fill();
      x.clip();
      if(wcVideo && wcVideo.readyState >= 2){
        try {
          if(wcMirror){
            x.save();
            x.translate(el.x + el.w, el.y);
            x.scale(-1, 1);
            x.drawImage(wcVideo, 0, 0, el.w, el.h);
            x.restore();
          } else {
            x.drawImage(wcVideo, el.x, el.y, el.w, el.h);
          }
        } catch(e){}
      } else {
        // Placeholder text
        x.fillStyle = '#66667a';
        x.font = '500 16px Outfit, sans-serif';
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        x.fillText(el.label || 'Camera (not connected)', el.x + el.w/2, el.y + el.h/2);
      }
      x.restore();
      // Border (draw outside clip)
      if(el.bw > 0){
        x.strokeStyle = el.bc || '#7ed957';
        x.lineWidth = el.bw;
        x.beginPath();
        if(wcShape === 'circle'){
          var bcx = el.x + el.w/2, bcy = el.y + el.h/2;
          var brad = Math.min(el.w, el.h) / 2;
          x.arc(bcx, bcy, brad, 0, Math.PI*2);
        } else if(wcShape === 'rounded'){
          var wbr = Math.min(el.br || 14, el.w/2, el.h/2);
          x.moveTo(el.x + wbr, el.y);
          x.lineTo(el.x + el.w - wbr, el.y);
          x.quadraticCurveTo(el.x + el.w, el.y, el.x + el.w, el.y + wbr);
          x.lineTo(el.x + el.w, el.y + el.h - wbr);
          x.quadraticCurveTo(el.x + el.w, el.y + el.h, el.x + el.w - wbr, el.y + el.h);
          x.lineTo(el.x + wbr, el.y + el.h);
          x.quadraticCurveTo(el.x, el.y + el.h, el.x, el.y + el.h - wbr);
          x.lineTo(el.x, el.y + wbr);
          x.quadraticCurveTo(el.x, el.y, el.x + wbr, el.y);
          x.closePath();
        } else {
          x.rect(el.x, el.y, el.w, el.h);
        }
        x.stroke();
      }
    }
    if(el.type === 'tradingview'){
      var tvWt = el.widget || 'advanced';
      var tvLabel = (TV_WIDGET_TYPES.find(function(x){return x.v===tvWt}) || {l:'Chart'}).l;
      // Dark TV-style background
      x.fillStyle = '#131722';
      x.fillRect(el.x, el.y, el.w, el.h);
      // Border
      if(el.bw > 0){
        x.strokeStyle = el.bc || '#7ed957';
        x.lineWidth = el.bw;
        x.strokeRect(el.x, el.y, el.w, el.h);
      }
      // Fake chart ambiance: a soft gradient accent + light text
      var grad = x.createLinearGradient(el.x, el.y, el.x, el.y + el.h);
      grad.addColorStop(0, 'rgba(126,217,87,0.06)');
      grad.addColorStop(1, 'rgba(19,23,34,0)');
      x.fillStyle = grad;
      x.fillRect(el.x, el.y, el.w, el.h);
      // Big symbol label
      x.fillStyle = '#f0f0f5';
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.font = '700 ' + Math.min(42, Math.floor(el.w/18)) + 'px Outfit, sans-serif';
      x.fillText(el.symbol || 'FX:GBPJPY', el.x + el.w/2, el.y + el.h/2 - 14);
      // Subtitle
      x.fillStyle = '#7ed957';
      x.font = '600 ' + Math.min(16, Math.floor(el.w/45)) + 'px Outfit, sans-serif';
      x.fillText(tvLabel + ' · Live chart', el.x + el.w/2, el.y + el.h/2 + 18);
      // Attribution note
      x.fillStyle = '#66667a';
      x.textBaseline = 'bottom';
      x.font = '500 11px Outfit, sans-serif';
      x.fillText('TradingView widget — shown live on screen, placeholder in recording', el.x + el.w/2, el.y + el.h - 10);
    }
  }
  // Pen annotations
  var draws = s.draws || [];
  for(var di=0; di<draws.length; di++){
    var d = draws[di];
    if(!d.pts || d.pts.length < 2) continue;
    if(d.tool === 'eraser') continue;
    x.beginPath();
    x.moveTo(d.pts[0].x, d.pts[0].y);
    for(var pj=1; pj<d.pts.length; pj++) x.lineTo(d.pts[pj].x, d.pts[pj].y);
    x.lineCap = 'round'; x.lineJoin = 'round';
    x.strokeStyle = d.color;
    x.lineWidth = d.size;
    x.globalAlpha = (d.opacity || 100) / 100;
    x.stroke();
    x.globalAlpha = 1;
  }
  return cv;
}

window.exportPNG = async function(){
  showToast('Generating PNG...');
  var cv = await renderSlideToCanvas(cs(), 2);
  var u = cv.toDataURL('image/png');
  var a = document.createElement('a');
  a.href = u;
  a.download = 'ep-slide-' + (S.si+1) + '.png';
  a.click();
};

// =========================================================
// PDF EXPORT — full deck to PDF using jsPDF
// =========================================================
window.exportPDF = async function(){
  if(typeof window.jspdf === 'undefined'){
    showToast('jsPDF not loaded — check internet');
    return;
  }
  showToast('Generating PDF... (' + S.slides.length + ' slides)');
  try {
    var jsPDF = window.jspdf.jsPDF;
    // 16:9 landscape, pixels as unit for direct match to our stage
    var pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [STAGE_W, STAGE_H], compress: true });
    for(var i=0; i<S.slides.length; i++){
      if(i > 0) pdf.addPage([STAGE_W, STAGE_H], 'landscape');
      var cv = await renderSlideToCanvas(S.slides[i], 2);
      var img = cv.toDataURL('image/jpeg', 0.92);
      pdf.addImage(img, 'JPEG', 0, 0, STAGE_W, STAGE_H, undefined, 'FAST');
      // Update toast every few slides
      if(i % 3 === 0) showToast('Generating PDF... ' + (i+1) + '/' + S.slides.length);
    }
    pdf.save('ep-presenter-' + Date.now() + '.pdf');
    showToast('PDF exported: ' + S.slides.length + ' slides');
  } catch(e){
    console.error('PDF export failed:', e);
    showToast('PDF failed: ' + e.message);
  }
};

// =========================================================
// PPTX EXPORT — rasterized approach (every slide as an image in a .pptx)
// This guarantees perfect visual fidelity at the cost of editability in PowerPoint.
// =========================================================
window.exportPPTX = async function(){
  if(typeof JSZip === 'undefined'){
    showToast('JSZip not loaded — check internet');
    return;
  }
  showToast('Generating PPTX... (' + S.slides.length + ' slides)');
  try {
    var zip = new JSZip();
    // Slide dimensions in EMU (16:9 widescreen standard = 12192000 × 6858000)
    var SLIDE_W_EMU = 12192000;
    var SLIDE_H_EMU = 6858000;

    // ---- Fixed content types, rels, etc ----
    zip.file('[Content_Types].xml',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Default Extension="png" ContentType="image/png"/>' +
      '<Default Extension="jpeg" ContentType="image/jpeg"/>' +
      '<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>' +
      S.slides.map(function(_, i){
        return '<Override PartName="/ppt/slides/slide' + (i+1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>';
      }).join('') +
      '<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>' +
      '<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>' +
      '<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>' +
      '</Types>'
    );

    zip.file('_rels/.rels',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="ppt/presentation.xml"/>' +
      '</Relationships>'
    );

    // ---- presentation.xml ----
    var slideIdEntries = S.slides.map(function(_, i){
      return '<p:sldId id="' + (256+i) + '" r:id="rId' + (i+2) + '"/>';
    }).join('');
    zip.file('ppt/presentation.xml',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<p:presentation xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" saveSubsetFonts="1">' +
      '<p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst>' +
      '<p:sldIdLst>' + slideIdEntries + '</p:sldIdLst>' +
      '<p:sldSz cx="' + SLIDE_W_EMU + '" cy="' + SLIDE_H_EMU + '"/>' +
      '<p:notesSz cx="' + SLIDE_H_EMU + '" cy="' + SLIDE_W_EMU + '"/>' +
      '<p:defaultTextStyle/>' +
      '</p:presentation>'
    );

    // ---- presentation.xml.rels ----
    var presRelsEntries = S.slides.map(function(_, i){
      return '<Relationship Id="rId' + (i+2) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide' + (i+1) + '.xml"/>';
    }).join('');
    zip.file('ppt/_rels/presentation.xml.rels',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="slideMasters/slideMaster1.xml"/>' +
      presRelsEntries +
      '</Relationships>'
    );

    // ---- Minimal slide master ----
    zip.file('ppt/slideMasters/slideMaster1.xml',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<p:sldMaster xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">' +
      '<p:cSld><p:bg><p:bgRef idx="1001"><a:schemeClr val="bg1"/></p:bgRef></p:bg>' +
      '<p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/></p:spTree></p:cSld>' +
      '<p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/>' +
      '<p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst>' +
      '</p:sldMaster>'
    );
    zip.file('ppt/slideMasters/_rels/slideMaster1.xml.rels',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="../theme/theme1.xml"/>' +
      '</Relationships>'
    );

    // ---- Minimal slide layout ----
    zip.file('ppt/slideLayouts/slideLayout1.xml',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<p:sldLayout xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" type="blank" preserve="1">' +
      '<p:cSld name="Blank"><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/></p:spTree></p:cSld>' +
      '</p:sldLayout>'
    );
    zip.file('ppt/slideLayouts/_rels/slideLayout1.xml.rels',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="../slideMasters/slideMaster1.xml"/>' +
      '</Relationships>'
    );

    // ---- Minimal theme ----
    zip.file('ppt/theme/theme1.xml', buildMinimalTheme());

    // ---- Render each slide to JPEG and build slide XML ----
    for(var si=0; si<S.slides.length; si++){
      showToast('Rendering slide ' + (si+1) + '/' + S.slides.length);
      var slide = S.slides[si];
      var cv = await renderSlideToCanvas(slide, 1.5); // 1.5x for reasonable file size + quality
      var dataUrl = cv.toDataURL('image/jpeg', 0.88);
      var base64 = dataUrl.split(',')[1];
      zip.file('ppt/media/slide' + (si+1) + '.jpeg', base64, {base64:true});

      // Slide XML: one big picture filling the whole slide
      var slideXml =
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">' +
        '<p:cSld><p:spTree>' +
        '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>' +
        '<p:grpSpPr/>' +
        '<p:pic><p:nvPicPr>' +
        '<p:cNvPr id="2" name="Slide Image"/>' +
        '<p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr>' +
        '<p:nvPr/></p:nvPicPr>' +
        '<p:blipFill><a:blip r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></p:blipFill>' +
        '<p:spPr>' +
        '<a:xfrm><a:off x="0" y="0"/><a:ext cx="' + SLIDE_W_EMU + '" cy="' + SLIDE_H_EMU + '"/></a:xfrm>' +
        '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom>' +
        '</p:spPr></p:pic>' +
        '</p:spTree></p:cSld>' +
        '</p:sld>';
      zip.file('ppt/slides/slide' + (si+1) + '.xml', slideXml);

      // Slide rels
      var slideRels =
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/slide' + (si+1) + '.jpeg"/>' +
        '</Relationships>';
      zip.file('ppt/slides/_rels/slide' + (si+1) + '.xml.rels', slideRels);
    }

    showToast('Compressing PPTX...');
    var blob = await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ep-presenter-' + Date.now() + '.pptx';
    a.click();
    URL.revokeObjectURL(url);
    showToast('PPTX exported: ' + S.slides.length + ' slides');
  } catch(e){
    console.error('PPTX export failed:', e);
    showToast('PPTX failed: ' + e.message);
  }
};

// =========================================================
// KEYBOARD
// =========================================================
document.addEventListener('keydown', function(evt){
  if(S.ed) return;
  var target = evt.target;
  if(target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT')) return;

  if(S.pres){
    if(evt.key === 'Escape'){ evt.preventDefault(); exitPresent(); return; }
    if(evt.key === 'ArrowRight' || evt.key === ' ' || evt.key === 'PageDown'){ evt.preventDefault(); presNext(); return; }
    if(evt.key === 'ArrowLeft' || evt.key === 'PageUp'){ evt.preventDefault(); presPrev(); return; }
    if(evt.key === 'p' || evt.key === 'P'){ evt.preventDefault(); setPresTool('pen'); return; }
    if(evt.key === 'h' || evt.key === 'H'){ evt.preventDefault(); setPresTool('highlighter'); return; }
    if(evt.key === 'e' || evt.key === 'E'){ evt.preventDefault(); setPresTool('eraser'); return; }
    if(evt.key === 'c' || evt.key === 'C'){ evt.preventDefault(); setPresTool('cursor'); return; }
    if(evt.key === 'x' || evt.key === 'X'){ evt.preventDefault(); presClearDraws(); return; }
    if(evt.key === 'l' || evt.key === 'L'){ evt.preventDefault(); toggleLaser(); return; }
    if(evt.key === 'w' || evt.key === 'W'){ evt.preventDefault(); toggleWebcam(); return; }
    if(evt.key === 'r' || evt.key === 'R'){
      evt.preventDefault();
      if(S.recActive) stopRecording(); else startRecording();
      return;
    }
    return;
  }

  if((evt.key === 'Delete' || evt.key === 'Backspace') && S.selIds.length){
    evt.preventDefault();
    var ids = S.selIds.slice();
    updateSlide(function(s){s.els = s.els.filter(function(el){return ids.indexOf(el.id) === -1}); return s;});
    S.selIds = [];
  }
  if((evt.ctrlKey || evt.metaKey) && evt.key === 'z'){ evt.preventDefault(); doUndo(); }
  if((evt.ctrlKey || evt.metaKey) && (evt.key === 'y' || (evt.shiftKey && evt.key === 'Z'))){ evt.preventDefault(); doRedo(); }
  if((evt.ctrlKey || evt.metaKey) && evt.key === 's'){ evt.preventDefault(); savePresentation(); }
  if((evt.ctrlKey || evt.metaKey) && evt.key === 'c' && S.selIds.length){ evt.preventDefault(); copySelection(); }
  if((evt.ctrlKey || evt.metaKey) && evt.key === 'v' && S.clipboard){ evt.preventDefault(); pasteClipboard(); }
  if((evt.ctrlKey || evt.metaKey) && evt.key === 'd' && S.selIds.length){ evt.preventDefault(); duplicateSelection(); }
  if((evt.ctrlKey || evt.metaKey) && evt.key === 'a'){ evt.preventDefault(); selectAll(); }
  // Group / Ungroup
  if((evt.ctrlKey || evt.metaKey) && (evt.key === 'g' || evt.key === 'G')){
    evt.preventDefault();
    if(evt.shiftKey) ungroupSelection();
    else groupSelection();
  }
  // Arrow key nudging
  if(S.selIds.length && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(evt.key) >= 0){
    evt.preventDefault();
    var step = evt.shiftKey ? 10 : 1;
    var dx = evt.key === 'ArrowLeft' ? -step : evt.key === 'ArrowRight' ? step : 0;
    var dy = evt.key === 'ArrowUp' ? -step : evt.key === 'ArrowDown' ? step : 0;
    nudgeSelection(dx, dy);
  }
  if(evt.key === 'Escape'){
    if(S.pop){ S.pop = null; render(); }
    else if(S.ctxMenu){ S.ctxMenu = null; render(); }
    else { S.selIds = []; S.ed = null; render(); }
  }
  if(evt.key === 'F5'){ evt.preventDefault(); startPresent(); }
  // X in editor mode clears annotations on current slide (when no input focused)
  if((evt.key === 'x' || evt.key === 'X') && !evt.ctrlKey && !evt.metaKey && !evt.altKey){
    var tgt = evt.target;
    if(!tgt || (tgt.tagName !== 'INPUT' && tgt.tagName !== 'TEXTAREA' && !tgt.isContentEditable)){
      var cs_ = cs();
      if(cs_ && cs_.draws && cs_.draws.length){
        evt.preventDefault();
        clearDraws();
        showToast('Annotations cleared');
      }
    }
  }
});

window.setPresTool = function(t){
  S.tool = t;
  S.pop = null;
  renderPres();
};

window.addEventListener('resize', function(){
  if(S.pres) renderPres();
  else render();
});

// =========================================================
// ELEMENT INNER RENDERER
// =========================================================
function renderElInner(el, isPres){
  var h = '';
  if(el.type === 'text'){
    var hAlign = el.align || 'center';
    var vAlign = el.vAlign || 'center';
    var justify = hAlign === 'left' ? 'flex-start' : hAlign === 'right' ? 'flex-end' : 'center';
    var alignItems = vAlign === 'top' ? 'flex-start' : vAlign === 'bottom' ? 'flex-end' : 'center';
    h += '<div class="txt-box" style="width:'+el.w+'px;height:'+el.h+'px;border:'+el.bw+'px solid '+el.bc+';border-radius:'+el.br+'px;background:'+el.bg+';justify-content:'+justify+';align-items:'+alignItems+'">';
    if(S.ed === el.id && !isPres){
      h += '<textarea id="editInput" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()" style="color:'+el.color+';font-size:'+el.fs+'px;font-weight:'+el.fw+';text-align:'+hAlign+';height:'+(el.h-el.bw*2-20)+'px;cursor:text;user-select:text" onblur="finishEdit(\''+el.id+'\',this.value)">'+esc(el.text)+'</textarea>';
    } else {
      h += '<span style="color:'+el.color+';font-size:'+el.fs+'px;font-weight:'+el.fw+';text-align:'+hAlign+';display:block">'+esc(el.text)+'</span>';
    }
    h += '</div>';
  }
  if(el.type === 'line'){
    var mnx = Math.min(el.x1, el.x2) - 10, mny = Math.min(el.y1, el.y2) - 10;
    var mxx = Math.max(el.x1, el.x2) + 10, mxy = Math.max(el.y1, el.y2) + 10;
    var w = mxx - mnx, ht = mxy - mny;
    var lx1 = el.x1 - mnx, ly1 = el.y1 - mny, lx2 = el.x2 - mnx, ly2 = el.y2 - mny;
    h += '<svg width="'+w+'" height="'+ht+'" style="position:absolute;left:'+mnx+'px;top:'+mny+'px;overflow:visible">';
    if(el.arrow){
      h += '<defs><marker id="ah'+el.id+'" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="'+el.stroke+'"/></marker></defs>';
      h += '<line x1="'+lx1+'" y1="'+ly1+'" x2="'+lx2+'" y2="'+ly2+'" stroke="'+el.stroke+'" stroke-width="'+el.sw+'" stroke-linecap="round" marker-end="url(#ah'+el.id+')"/>';
    } else {
      h += '<line x1="'+lx1+'" y1="'+ly1+'" x2="'+lx2+'" y2="'+ly2+'" stroke="'+el.stroke+'" stroke-width="'+el.sw+'" stroke-linecap="round"/>';
    }
    if(!isPres){
      h += '<line x1="'+lx1+'" y1="'+ly1+'" x2="'+lx2+'" y2="'+ly2+'" class="line-hit" onmousedown="startElDrag(event,\''+el.id+'\')"/>';
    }
    h += '</svg>';
    if(S.sel === el.id && !isPres){
      h += '<div class="ep" style="left:'+el.x1+'px;top:'+el.y1+'px" onmousedown="startEp(event,\''+el.id+'\',1)"></div>';
      h += '<div class="ep" style="left:'+el.x2+'px;top:'+el.y2+'px" onmousedown="startEp(event,\''+el.id+'\',2)"></div>';
    }
  }
  if(el.type === 'note'){
    h += '<div class="note" style="width:'+el.w+'px;height:'+el.h+'px;background:'+el.bg+'">';
    if(S.ed === el.id && !isPres){
      h += '<textarea id="editInput" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()" style="height:'+(el.h-24)+'px;cursor:text;user-select:text" onblur="finishEdit(\''+el.id+'\',this.value)">'+esc(el.text)+'</textarea>';
    } else {
      h += '<div style="font-size:14px;color:#1a1a1a;font-weight:500;white-space:pre-wrap;overflow:hidden;height:'+(el.h-24)+'px">'+esc(el.text)+'</div>';
    }
    h += '</div>';
  }
  if(el.type === 'image'){
    h += '<img src="'+el.src+'" style="width:'+el.w+'px;height:'+el.h+'px;object-fit:cover;border-radius:'+el.br+'px;border:'+el.bw+'px solid '+el.bc+';opacity:'+el.op+';pointer-events:none;display:block" draggable="false">';
  }
  if(el.type === 'shape'){
    h += renderShape(el);
  }
  if(el.type === 'list'){
    h += renderList(el, isPres);
  }
  if(el.type === 'screenshare'){
    h += renderScreenShare(el, isPres);
  }
  if(el.type === 'webcam'){
    h += renderWebcam(el, isPres);
  }
  if(el.type === 'tradingview'){
    h += renderTradingViewElement(el, isPres);
  }
  return h;
}

function renderTradingViewElement(el, isPres){
  var wt = el.widget || 'advanced';
  var wtLabel = (TV_WIDGET_TYPES.find(function(x){return x.v===wt}) || {l:'Advanced'}).l;
  var h = '<div class="tv-el" style="width:'+el.w+'px;height:'+el.h+'px;border:'+(el.bw||1)+'px solid '+(el.bc||'#7ed957')+';border-radius:'+(el.br||8)+'px">';
  h += '<div class="tv-loading">'+I.chart+'<span>Loading '+wtLabel+'…</span></div>';
  h += '<div class="tv-badge">'+esc(el.symbol || '')+' · '+wtLabel+'</div>';
  h += '<div id="tv-container-'+el.id+'" style="width:100%;height:100%;position:absolute;inset:0"></div>';
  // Click shield: in editor mode, blocks iframe from receiving mouse events so parent drag/select works.
  // In presentation, removed so user can interact with the widget.

// =========================================================
// SCREEN SHARE RENDERER
// =========================================================
function renderScreenShare(el, isPres){
  var hasStream = !!_screenShareStreams[el.id];
  var label = el.label || 'Screen Share';
  var borderStyle = el.borderStyle || 'solid';
  var bw = el.bw != null ? el.bw : 2;
  var bc1 = el.bc || '#7ed957';
  var bc2 = el.bc2 || '#9b59ff';
  var br = el.br != null ? el.br : 10;
  var useGradient = (borderStyle === 'gradient' || borderStyle === 'animated') && bw > 0;

  var h = '';
  if(useGradient){
    var gradBg = 'linear-gradient(135deg, '+bc1+' 0%, '+bc2+' 50%, '+bc1+' 100%)';
    var animClass = (borderStyle === 'animated') ? ' ep-border-anim' : '';
    h += '<div class="ep-grad-border'+animClass+'" style="width:'+el.w+'px;height:'+el.h+'px;background:'+gradBg+';background-size:300% 300%;border-radius:'+br+'px;padding:'+bw+'px;box-sizing:border-box">';
    h += '<div class="ss-el" style="width:100%;height:100%;border:none;border-radius:'+Math.max(0, br - Math.min(bw,4))+'px;box-sizing:border-box">';
  } else {
    h += '<div class="ss-el" style="width:'+el.w+'px;height:'+el.h+'px;border:'+bw+'px solid '+bc1+';border-radius:'+br+'px;box-sizing:border-box">';
  }

  if(hasStream){
    // Render live badge based on per-element preferences
    var badgeStyle = el.badgeStyle || 'full';
    var badgePos = el.badgePos || 'tl';
    if(badgeStyle !== 'off'){
      var badgeClass = 'ss-live-badge ss-live-badge-' + badgePos + (badgeStyle === 'dot' ? ' ss-live-badge-dot-only' : '');
      h += '<div class="'+badgeClass+'">' + (badgeStyle === 'full' ? 'LIVE' : '') + '</div>';
    }
    // Controls overlay — only visible when element is selected in editor (to avoid clutter)
    if(!isPres){
      h += '<div class="ss-controls">';
      h += '<button onmousedown="event.stopPropagation()" onclick="event.stopPropagation();connectScreenShare(\''+el.id+'\',event)" title="Change source">Change</button>';
      h += '<button class="disconnect" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();disconnectScreenShare(\''+el.id+'\',event)">Disconnect</button>';
      h += '</div>';
    }
    h += '<video id="ss-video-'+el.id+'" autoplay muted playsinline></video>';
  } else {
    // Placeholder — the CARD itself is NOT clickable so users can drag/select it.
    // Only the explicit "Connect Source" button triggers the picker.
    h += '<div class="ss-placeholder">';
    h += I.monitor;
    h += '<div class="ss-title">'+esc(label)+'</div>';
    h += '<div class="ss-hint">Use the panel on the right or click the button below</div>';
    h += '<button class="ss-connect" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();connectScreenShare(\''+el.id+'\',event)">Connect Source</button>';
    h += '</div>';
  }
  h += '</div>';
  if(useGradient) h += '</div>';
  return h;
}

// Render webcam slide element. Mirrors renderScreenShare but uses camera stream
// and supports shape variants (circle / rounded / sharp rect) + mirror transform.
function renderWebcam(el, isPres){
  var hasStream = !!_webcamElStreams[el.id];
  var label = el.label || 'Webcam';
  var shape = el.shape || 'circle';
  var mirror = el.mirror !== false;
  var borderStyle = el.borderStyle || 'solid';
  var bw = el.bw || 3;
  var bc1 = el.bc || '#7ed957';
  var bc2 = el.bc2 || '#9b59ff';
  // Shape → border-radius
  var borderRadius;
  if(shape === 'circle') borderRadius = '50%';
  else if(shape === 'rect') borderRadius = '0px';
  else borderRadius = (el.br || 14) + 'px';

  // Decide rendering strategy:
  // - solid: standard CSS border on the .wc-el
  // - gradient / animated: outer wrapper has gradient background, inner inset by bw
  var useGradient = (borderStyle === 'gradient' || borderStyle === 'animated') && bw > 0;

  var h = '';
  if(useGradient){
    var gradBg = 'linear-gradient(135deg, '+bc1+' 0%, '+bc2+' 50%, '+bc1+' 100%)';
    var animClass = (borderStyle === 'animated') ? ' ep-border-anim' : '';
    h += '<div class="ep-grad-border'+animClass+'" style="width:'+el.w+'px;height:'+el.h+'px;background:'+gradBg+';background-size:300% 300%;border-radius:'+borderRadius+';padding:'+bw+'px;box-sizing:border-box">';
    h += '<div class="wc-el" style="width:100%;height:100%;border:none;border-radius:'+(shape==='rect'?'0':(shape==='circle'?'50%':((el.br||14)-Math.min(bw,4))+'px'))+';box-sizing:border-box">';
  } else {
    h += '<div class="wc-el" style="width:'+el.w+'px;height:'+el.h+'px;border:'+bw+'px solid '+bc1+';border-radius:'+borderRadius+';box-sizing:border-box">';
  }

  if(hasStream){
    var badgeStyle = el.badgeStyle || 'off';
    var badgePos = el.badgePos || 'tl';
    if(badgeStyle !== 'off'){
      // For circle webcams, the corners are outside the visible area so badges
      // need extra inset to land inside the circle. We add a modifier class.
      var circleClass = (shape === 'circle') ? ' ss-live-badge-circle' : '';
      var badgeClass = 'ss-live-badge ss-live-badge-' + badgePos + (badgeStyle === 'dot' ? ' ss-live-badge-dot-only' : '') + circleClass;
      h += '<div class="'+badgeClass+'">' + (badgeStyle === 'full' ? 'LIVE' : '') + '</div>';
    }
    if(!isPres){
      h += '<div class="wc-controls">';
      h += '<button onmousedown="event.stopPropagation()" onclick="event.stopPropagation();connectWebcamEl(\''+el.id+'\',event)" title="Reconnect camera">Reconnect</button>';
      h += '<button class="disconnect" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();disconnectWebcamEl(\''+el.id+'\',event)">Disconnect</button>';
      h += '</div>';
    }
    var videoStyle = 'width:100%;height:100%;object-fit:cover;display:block;background:#000;' + (mirror ? 'transform:scaleX(-1);' : '');
    h += '<video id="wc-video-'+el.id+'" autoplay muted playsinline style="'+videoStyle+'"></video>';
  } else {
    h += '<div class="wc-placeholder">';
    h += I.webcam;
    h += '<div class="ss-title">'+esc(label)+'</div>';
    h += '<div class="ss-hint">Click the button below to connect your camera</div>';
    h += '<button class="ss-connect" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();connectWebcamEl(\''+el.id+'\',event)">Connect Camera</button>';
    h += '</div>';
  }
  h += '</div>';
  if(useGradient) h += '</div>';
  return h;
}

// =========================================================
// LIST RENDERERS - one function per style
// =========================================================
// Filter list items by reveal step in presentation mode.
// In editor: show all items + a small number badge if a reveal value is set.
// In presentation: hide items with reveal > current revealStep.
// Items without a reveal value (or reveal === 0) are always shown.
function filterListItemsByReveal(items, isPres){
  if(!isPres || !S.pres) return items.map(function(it){ return { item: it, hidden: false }; });
  return items.map(function(it){
    var hidden = it.reveal && it.reveal > S.revealStep;
    return { item: it, hidden: hidden };
  });
}

function renderList(el, isPres){
  if(el.style === 'stacked-card') return renderStackedCardList(el, isPres);
  if(el.style === 'table') return renderTableList(el, isPres);
  if(el.style === 'checklist') return renderChecklistList(el, isPres);
  if(el.style === 'timeline') return renderTimelineList(el, isPres);
  return '';
}

function renderShape(el){

  }
  if(el.shape === 'circle'){

  }
  return '';
}

// Live opacity slider: update element + re-render only the one shape, no panel rebuild
window.liveUpdateShapeOpacity = function(id, val){
  var el = gEl(id);
  if(!el) return;
  el.fillOp = val;
  // Update label
  var lbl = document.getElementById('fillOpLbl_'+id);
  if(lbl) lbl.textContent = Math.round(val*100)+'%';
  // Re-render just the element layer, not the whole panel
  renderEls();
};

window.commitShapeOpacity = function(id, val){
  var el = gEl(id);
  if(!el) return;
  el.fillOp = val;
  pushHist();
};

    if(el.type === 'line'){
      h += '<div style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:'+pe+';z-index:'+(i+2)+'"';
      if(!isPres) h += ' oncontextmenu="showContext(event,\''+el.id+'\')"';
      h += '>';
      h += renderElInner(el, isPres);
      h += '</div>';
      continue;
    }
    var isRevealing = isPres && el.reveal && el.reveal === S.revealStep;
    var elAnimClass = '';
    if(isRevealing && el.revealAnim){
      // Per-element override — wrap in own animation class so it doesn't inherit the slide-level one
      elAnimClass = ' ep-anim-' + el.revealAnim;
    }
    h += '<div class="el'+(sel?' sel':'')+(el.lk?' locked':'')+(isRevealing ? ' ep-revealing' : '')+elAnimClass+'" style="left:'+el.x+'px;top:'+el.y+'px;z-index:'+(i+2)+';pointer-events:'+pe+'"';
    if(!isPres){
      h += ' onmousedown="startElDrag(event,\''+el.id+'\')" oncontextmenu="showContext(event,\''+el.id+'\')"';
    }
    h += '>';
    h += renderElInner(el, isPres);
    // Reveal step badge (editor mode only)
    if(!isPres && el.reveal && el.reveal > 0){
      h += '<div style="position:absolute;top:-10px;left:-10px;width:22px;height:22px;border-radius:50%;background:#ffa500;color:#000;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.5);z-index:20;pointer-events:none" title="Reveals on click '+el.reveal+'">'+el.reveal+'</div>';
    }
    // Resize handles only on single selection (avoids clutter)
    if(sel && singleSelect && S.tool === 'select' && el.type !== 'line'){
      var corners = ['nw','ne','sw','se','n','s','e','w'];
      for(var ci=0; ci<corners.length; ci++){
        var c = corners[ci], cst = '';
        if(c.indexOf('n') >= 0) cst += 'top:-5px;';
        if(c.indexOf('s') >= 0) cst += 'bottom:-5px;';
        if(c.indexOf('w') >= 0) cst += 'left:-5px;';
        if(c.indexOf('e') >= 0) cst += 'right:-5px;';
        if(c === 'n' || c === 's') cst += 'left:50%;margin-left:-5px;';
        if(c === 'e' || c === 'w') cst += 'top:50%;margin-top:-5px;';
        var cur = {nw:'nw-resize',ne:'ne-resize',sw:'sw-resize',se:'se-resize',n:'n-resize',s:'s-resize',e:'e-resize',w:'w-resize'};
        h += '<div class="rh" style="'+cst+'cursor:'+cur[c]+'" onmousedown="event.stopPropagation();startResize(event,\''+el.id+'\',\''+c+'\')"></div>';
      }
    }
    h += '</div>';
  }
  // Group bounding boxes — drawn for any group whose member is in the current selection.
  // Only in editor mode (not presentation).
  if(!isPres && S.selIds.length > 0){
    var gidsInSel = {};
    S.selIds.forEach(function(id){
      var el = gEl(id);
      if(el && el.gid) gidsInSel[el.gid] = true;
    });
    Object.keys(gidsInSel).forEach(function(gid){
      var b = getGroupBounds(gid);
      if(!b) return;
      var pad = 6;
      h += '<div class="ep-group-box" style="left:'+(b.x - pad)+'px;top:'+(b.y - pad)+'px;width:'+(b.w + pad*2)+'px;height:'+(b.h + pad*2)+'px"></div>';
    });
  }
  return h;
}

function renderSnapGuides(){
  var layer = document.getElementById('guidesLayer');
  if(!layer) return;
  if(!S.snapGuides.length){ layer.innerHTML = ''; return; }
  var h = '';
  S.snapGuides.forEach(function(g){
    if(g.type === 'v'){
      // Vertical guide line (x-axis snap) - clamp so edge snaps still show
      var x = Math.max(1, Math.min(STAGE_W - 1, g.x));
      h += '<div style="position:absolute;left:'+x+'px;top:-20px;width:2px;height:'+(STAGE_H+40)+'px;background:#ff3366;box-shadow:0 0 6px rgba(255,51,102,0.8);pointer-events:none;z-index:999;margin-left:-1px"></div>';
    } else {
      var y = Math.max(1, Math.min(STAGE_H - 1, g.y));
      h += '<div style="position:absolute;left:-20px;top:'+y+'px;width:'+(STAGE_W+40)+'px;height:2px;background:#ff3366;box-shadow:0 0 6px rgba(255,51,102,0.8);pointer-events:none;z-index:999;margin-top:-1px"></div>';
    }
  });
  layer.innerHTML = h;
}

function renderEls(){
  var stage = document.getElementById('canvasStage');
  if(!stage) return;
  var layer = document.getElementById('elsLayer');
  if(!layer) return;
  layer.innerHTML = renderElsHtml(cs(), false);
  // Auto-grow all list textareas to fit their content
  var tas = layer.querySelectorAll('textarea');
  for(var i=0; i<tas.length; i++) autoGrow(tas[i]);
}

// =========================================================
// STAGE SCALING
// =========================================================
function fitStageToContainer(containerEl){
  if(!containerEl) return 1;
  var cw = containerEl.offsetWidth - 40;
  var ch = containerEl.offsetHeight - 40;
  var scale = Math.min(cw / STAGE_W, ch / STAGE_H);
  return Math.max(0.1, scale);
}

// =========================================================
// THUMBNAIL RENDERER (live DOM snapshot scaled down)
// =========================================================
function renderThumbnail(slide, index){
  // Target thumbnail container is ~150x85 (16/9 ratio with 170px panel)
  var thumbW = 150;
  var scale = thumbW / STAGE_W;
  var thumbH = STAGE_H * scale;
  var inner = '<div class="st-preview-inner" style="width:'+STAGE_W+'px;height:'+STAGE_H+'px;background:'+slide.bg+';transform:scale('+scale+')">';
  // Render elements (simplified - no selection handles, no interactivity)
  for(var i=0; i<slide.els.length; i++){
    var el = slide.els[i];
    if(el.type === 'line'){
      inner += '<div style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none">';
      inner += renderElInner(el, true);
      inner += '</div>';
      continue;
    }
    inner += '<div style="position:absolute;left:'+el.x+'px;top:'+el.y+'px;pointer-events:none">';
    inner += renderElInner(el, true);
    inner += '</div>';
  }
  // Draw annotations as SVG overlay in thumbnail
  if(slide.draws && slide.draws.length){
    inner += '<svg style="position:absolute;inset:0;pointer-events:none" width="'+STAGE_W+'" height="'+STAGE_H+'">';
    for(var di=0; di<slide.draws.length; di++){
      var d = slide.draws[di];
      if(!d.pts || d.pts.length < 2 || d.tool === 'eraser') continue;
      var pts = d.pts.map(function(p){return p.x+','+p.y}).join(' ');
      inner += '<polyline points="'+pts+'" fill="none" stroke="'+d.color+'" stroke-width="'+d.size+'" stroke-linecap="round" stroke-linejoin="round" opacity="'+((d.opacity||100)/100)+'"/>';
    }
    inner += '</svg>';
  }
  inner += '</div>';
  return inner;
}

  // Auto-grow all list textareas on initial paint

// =========================================================
// PROPERTIES PANEL
// =========================================================
function renderPropsPanel(el){
  var h = '<div class="pp"><div class="pp-t">'+el.type.toUpperCase()+' Properties</div>';

  if(el.type !== 'line'){
    h += propSection('Position & Size', [
      propRow('X', Math.round(el.x), "updateEl('"+el.id+"',{x:+this.value})", 'number'),
      propRow('Y', Math.round(el.y), "updateEl('"+el.id+"',{y:+this.value})", 'number'),
      propRow('W', Math.round(el.w), "updateEl('"+el.id+"',{w:+this.value})", 'number'),
      propRow('H', Math.round(el.h), "updateEl('"+el.id+"',{h:+this.value})", 'number')
    ]);
  }

  if(el.type === 'line'){
    h += propSection('Endpoints', [
      propRow('X1', Math.round(el.x1), "updateEl('"+el.id+"',{x1:+this.value})", 'number'),
      propRow('Y1', Math.round(el.y1), "updateEl('"+el.id+"',{y1:+this.value})", 'number'),
      propRow('X2', Math.round(el.x2), "updateEl('"+el.id+"',{x2:+this.value})", 'number'),
      propRow('Y2', Math.round(el.y2), "updateEl('"+el.id+"',{y2:+this.value})", 'number')
    ]);
    h += propSection('Style', [
      propRow('Color', el.stroke, "updateEl('"+el.id+"',{stroke:this.value})", 'color'),
      propRow('Width', el.sw, "updateEl('"+el.id+"',{sw:+this.value})", 'number')
    ]);
  }

  if(el.type === 'text'){
    var curAlign = el.align || 'center';
    var curVAlign = el.vAlign || 'center';
    h += propSection('Text', [
      propRow('Size', el.fs, "updateEl('"+el.id+"',{fs:+this.value})", 'number'),
      propRow('Weight', el.fw, "updateEl('"+el.id+"',{fw:this.value})", 'select', ['300','400','500','600','700','800']),
      propRow('Color', el.color, "updateEl('"+el.id+"',{color:this.value})", 'color')

    h += '<div class="ps"><div class="ps-t">Alignment</div>';
    h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:6px">';
    var hAligns = [['left','L'],['center','C'],['right','R']];
    hAligns.forEach(function(a){
      var active = curAlign === a[0];
      h += '<button class="sp-btn" style="padding:7px 0'+(active?';border-color:var(--g);color:var(--g)':'')+'" onclick="updateEl(\''+el.id+'\',{align:\''+a[0]+'\'})" title="Align '+a[0]+'">'+a[1]+'</button>';
    });
    h += '</div>';
    h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px">';
    var vAligns = [['top','T'],['center','M'],['bottom','B']];
    vAligns.forEach(function(a){
      var active = curVAlign === a[0];
      h += '<button class="sp-btn" style="padding:7px 0'+(active?';border-color:var(--g);color:var(--g)':'')+'" onclick="updateEl(\''+el.id+'\',{vAlign:\''+a[0]+'\'})" title="Vertical '+a[0]+'">'+a[1]+'</button>';
    });
    h += '</div></div>';
    h += '<div class="ps"><div class="ps-t">Border</div><div class="bcs">';
    for(var bi=0; bi<BORDER_COLORS.length; bi++){
      var c = BORDER_COLORS[bi];
      h += '<div class="bcs-d'+(el.bc===c?' a':'')+'" style="background:'+c+'" onclick="updateEl(\''+el.id+'\',{bc:\''+c+'\'})"></div>';
    }

  html += '<div class="ep-gp-section">';

  ['fast','normal','slow'].forEach(function(s){
    var active = globalSpeed === s;
    html += '<button class="sp-btn" style="padding:9px 4px;font-weight:600'+(active?';border-color:var(--g);color:var(--g);background:rgba(126,217,87,0.08)':'')+'" onclick="setGlobalSpeed(\''+s+'\');closeGlobalPreferences();openGlobalPreferences()">'+s.charAt(0).toUpperCase()+s.slice(1)+'</button>';
  });

  html += '</div>';

  html += '<div class="ep-gp-section">';

  html += '<div class="ep-gp-hint">Used for slides without their own override</div>';
  html += '<select class="pr-i" style="width:100%" onchange="setGlobalTransition(this.value)">';
  TRANSITION_OPTIONS.forEach(function(t){
    html += '<option value="'+t.v+'"' + (globalTrans === t.v ? ' selected' : '') + '>'+t.l+'</option>';
  });
  html += '</select>';
  html += '</div>';
  html += '<div class="ep-gp-section">';

  html += '<div class="ep-gp-hint">Applied to elements + list items as they reveal</div>';

  html += '</select>';

  html += '<div style="background:rgba(255,165,0,0.08);border:1px solid rgba(255,165,0,0.25);border-radius:8px;padding:12px;font-size:11px;color:#ffd596;line-height:1.5">';
  html += '<strong style="color:#ffa500">Tip:</strong> Slide transitions only fire when you CHANGE slides during presentation. They won\'t replay on the same slide.';
  html += '</div>';

  html += '</div>';
  html += '</div>';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
  // Close on Esc / outside click
  overlay.addEventListener('click', function(e){
    if(e.target === overlay) closeGlobalPreferences();
  });
  var keyHandler = function(e){
    if(e.key === 'Escape'){ closeGlobalPreferences(); document.removeEventListener('keydown', keyHandler); }
  };
  document.addEventListener('keydown', keyHandler);
};
window.closeGlobalPreferences = function(){

function renderMultiSelectPanel(){
  var count = S.selIds.length;
  var h = '<div class="pp">';
  h += '<div class="pp-t">'+count+' items selected</div>';

  // Detect group state of selection
  var slide = cs();
  var gids = {};
  var firstReveal = null;
  var allSameReveal = true;
  if(slide){
    S.selIds.forEach(function(id){
      var el = gEl(id);
      if(el && el.gid) gids[el.gid] = true;
      if(el){
        var rev = el.reveal || 0;
        if(firstReveal === null) firstReveal = rev;
        else if(firstReveal !== rev) allSameReveal = false;
      }
    });
  }
  var groupCount = Object.keys(gids).length;
  var allInOneGroup = (groupCount === 1) && S.selIds.every(function(id){
    var el = gEl(id);
    return el && el.gid && gids[el.gid];
  });

  // Group section — top of panel because it's the most semantically important
  h += '<div class="ps"><div class="ps-t">Group</div>';

    h += '<div style="background:rgba(255,165,0,0.08);border:1px solid rgba(255,165,0,0.25);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:11px;color:#ffd596;display:flex;align-items:center;gap:6px"><span style="color:#ffa500">●</span> Grouped (' + count + ' members)</div>';

  }
  h += '</div>';

  // Reveal-on-click for the whole group
  h += '<div class="ps"><div class="ps-t">Reveal on Click</div>';
  h += '<div style="font-size:10px;color:var(--muted);line-height:1.4;margin-bottom:6px">Same step on every selected element \u2014 they reveal together</div>';

  h += '</div>';
  h += '</div>';

  // Align section — different behaviour for whole-group vs ungrouped multi-select
  h += '<div class="ps"><div class="ps-t">Align</div>';
  if(allInOneGroup){
    h += '<div style="font-size:10px;color:var(--muted);line-height:1.4;margin-bottom:6px">Moves the whole group to that edge of the slide. Children keep their relative positions.</div>';
  } else {
    h += '<div style="font-size:10px;color:var(--muted);line-height:1.4;margin-bottom:6px">Aligns the edges/centers of selected items to each other. Tip: group first if you want them to move as one.</div>';

  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px">';

  h += '<button class="sp-btn" style="padding:8px 0" onclick="alignSelection(\'right\')" title="Align Right edges">'+I.alignRight+'</button>';
  h += '<button class="sp-btn" style="padding:8px 0" onclick="alignSelection(\'top\')" title="Align Top edges">'+I.alignTop+'</button>';
  h += '<button class="sp-btn" style="padding:8px 0" onclick="alignSelection(\'vcenter\')" title="Center vertically">'+I.alignMiddle+'</button>';
  h += '<button class="sp-btn" style="padding:8px 0" onclick="alignSelection(\'bottom\')" title="Align Bottom edges">'+I.alignBottom+'</button>';
  h += '</div></div>';

  if(count >= 3 && !allInOneGroup){
    h += '<div class="ps"><div class="ps-t">Distribute</div>';
    h += '<div style="font-size:10px;color:var(--muted);line-height:1.4;margin-bottom:6px">Equal spacing between selected items.</div>';

  h += '<div style="font-size:11px;color:var(--gray);line-height:1.5">Shift+click to add to selection. Arrow keys nudge by 1px, Shift+arrows by 10px. Ctrl+G groups selection.</div>';

// Apply the same reveal step to every element in the current selection.
window.setSelectionReveal = function(step){
  if(!S.selIds.length) return;
  var ids = S.selIds.slice();
  updateSlide(function(s){
    s.els.forEach(function(e){
      if(ids.indexOf(e.id) >= 0){
        if(step > 0) e.reveal = step;
        else delete e.reveal;
      }
    });
    return s;
  });
};

window.deleteSelection = function(){
  if(!S.selIds.length) return;
  if(!confirm('Delete ' + S.selIds.length + ' item' + (S.selIds.length>1?'s':'') + '?')) return;
  var ids = S.selIds.slice();
  updateSlide(function(s){s.els = s.els.filter(function(el){return ids.indexOf(el.id) === -1}); return s;});
  S.selIds = [];
};


function propRow(label, value, handler, type, opts){
  type = type || 'text';
  var inp;
  if(type === 'select'){
    inp = '<select class="pr-i" onchange="'+handler+'">';
    for(var i=0; i<opts.length; i++){
      inp += '<option value="'+opts[i]+'"'+(String(value)===String(opts[i])?' selected':'')+'>'+opts[i]+'</option>';
    }
    inp += '</select>';
  } else if(type === 'color'){
    inp = '<input type="color" value="'+value+'" class="pr-i" style="padding:0;height:26px;cursor:pointer" onchange="'+handler+'">';
  } else {
    inp = '<input type="'+type+'" value="'+esc(String(value))+'" class="pr-i" onchange="'+handler+'">';
  }
  return '<div class="pr"><span class="pr-l">'+label+'</span>'+inp+'</div>';
}

// Parse a color string ("#hex", "rgb(...)", "rgba(...)") into {hex, alpha}.
// Used by propFillRow so the color picker can show a swatch even for rgba values.
function parseColorWithAlpha(value){
  var s = String(value || '').trim();
  if(!s) return { hex: '#000000', alpha: 1 };
  // rgba(r,g,b,a)
  var m = s.match(/^rgba?\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+))?\s*\)$/i);
  if(m){
    var r = parseInt(m[1],10), g = parseInt(m[2],10), b = parseInt(m[3],10);
    var a = m[4] !== undefined ? parseFloat(m[4]) : 1;
    var toHex = function(n){ var h = n.toString(16); return h.length === 1 ? '0'+h : h; };
    return { hex: '#' + toHex(r) + toHex(g) + toHex(b), alpha: a };
  }
  // #rrggbb
  if(/^#[0-9a-f]{6}$/i.test(s)) return { hex: s, alpha: 1 };
  // #rgb shorthand
  if(/^#[0-9a-f]{3}$/i.test(s)){
    return { hex: '#' + s[1]+s[1]+s[2]+s[2]+s[3]+s[3], alpha: 1 };
  }
  // 'transparent' or unknown — fall back
  if(s === 'transparent') return { hex: '#000000', alpha: 0 };
  return { hex: '#000000', alpha: 1 };
}

// Combine a hex color and alpha (0-1) back into "rgba(r,g,b,a)" or "#hex" (if alpha=1)
function formatColorWithAlpha(hex, alpha){
  alpha = Math.max(0, Math.min(1, alpha));
  if(alpha >= 0.999) return hex;
  var h = String(hex || '#000000').replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return 'rgba('+r+','+g+','+b+','+(Math.round(alpha*100)/100)+')';
}

// Render a "fill" property row: color swatch + opacity slider + preset palette,
// all feeding back into the same property as either #hex (alpha=1) or rgba() (alpha<1).
// elId: the element id; prop: property name (e.g. 'bg', 'fill').
function propFillRow(label, elId, prop, value){
  var parsed = parseColorWithAlpha(value);
  var hex = parsed.hex;
  var alpha = parsed.alpha;
  var pct = Math.round(alpha * 100);
  // Use a unique input id so onchange handlers can read both inputs together
  var hexId = 'fill_'+elId+'_'+prop+'_hex';
  var alphaId = 'fill_'+elId+'_'+prop+'_alpha';
  var combineCode = "(function(){var h=document.getElementById('"+hexId+"').value;var a=parseInt(document.getElementById('"+alphaId+"').value,10)/100;updateEl('"+elId+"',{"+prop+":formatColorWithAlpha(h,a)});})()";
  var h = '<div class="pr"><span class="pr-l">'+label+'</span>';
  h += '<div style="flex:1;display:flex;gap:6px;align-items:center">';
  h += '<input id="'+hexId+'" type="color" value="'+hex+'" style="width:34px;height:26px;border:1px solid var(--brd);border-radius:4px;background:none;cursor:pointer;padding:0;flex-shrink:0" onchange="'+combineCode+'">';
  h += '<input id="'+alphaId+'" type="range" min="0" max="100" step="5" value="'+pct+'" title="Opacity" style="flex:1;min-width:40px" onchange="'+combineCode+'">';
  h += '<span style="font-size:10px;color:var(--muted);min-width:28px;text-align:right">'+pct+'%</span>';
  h += '</div></div>';
  // Preset palette — common backgrounds for slides/elements
  var presets = [
    { l:'Off', v:'transparent' },
    { l:'Black 45%', v:'rgba(0,0,0,0.45)' },
    { l:'Black 30%', v:'rgba(0,0,0,0.3)' },
    { l:'Black 70%', v:'rgba(0,0,0,0.7)' },
    { l:'White 10%', v:'rgba(255,255,255,0.1)' },
    { l:'Brand', v:'#7ed957' },
    { l:'Orange', v:'#ffa500' },
    { l:'Solid Black', v:'#000000' },
    { l:'Solid White', v:'#ffffff' }
  ];
  h += '<div style="display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:6px;padding:0 6px">';
  presets.forEach(function(p){
    var isActive = String(value).toLowerCase().replace(/\s/g,'') === String(p.v).toLowerCase().replace(/\s/g,'');
    var checker = p.v === 'transparent'
      ? 'background:repeating-conic-gradient(#444 0% 25%,#222 0% 50%) 50%/8px 8px'
      : 'background:'+p.v;
    h += '<div class="ep-fill-preset'+(isActive?' active':'')+'" style="'+checker+'" title="'+p.l+'" onclick="updateEl(\''+elId+'\',{'+prop+':\''+p.v+'\'})"></div>';
  });
  h += '</div>';
  return h;
}
window.formatColorWithAlpha = formatColorWithAlpha;
