// =========================================================
// PRESENTATION RENDER
// =========================================================
function renderPres(){
  var app = document.getElementById('app');
  var slide = S.slides[S.presSlide];
  if(!slide) return;

  // Calculate scale to fit window
  var winW = window.innerWidth, winH = window.innerHeight;
  var scale = Math.min(winW / STAGE_W, winH / STAGE_H);
  S.stageScale = scale;
  var stageDispW = STAGE_W * scale, stageDispH = STAGE_H * scale;

  var isDrawTool = S.tool === 'pen' || S.tool === 'highlighter' || S.tool === 'eraser';
  var cursor = isDrawTool ? 'none' : 'default';

  // Determine effective transition + reveal animation classes for this slide.
  // We add a key prop to the stage so animation re-runs on every slide change.
  var effTrans = getEffectiveTransition(slide);
  var effReveal = S.globalRevealAnim || 'fade';
  var transClass = ' ep-trans-' + effTrans;
  var revealClass = ' ep-anim-' + effReveal;
  // Animation triggers — bump these every slide change / reveal step for re-render
  var animKey = S.presSlide + '-' + S.revealStep;

  var h = '<div class="pres-root'+revealClass+'">';
  // Don't include the transition class in the initial HTML — we add it post-render
  // after a forced reflow so the browser sees a fresh animation each render.
  h += '<div class="pres-stage" data-trans="'+effTrans+'" data-anim-key="'+animKey+'" style="width:'+stageDispW+'px;height:'+stageDispH+'px;background:'+slide.bg+';cursor:'+cursor+'" id="presStage" onmousedown="onCanvasDown(event)">';
  h += '<div id="elsLayer" style="position:absolute;inset:0;transform:scale('+scale+');transform-origin:0 0;width:'+STAGE_W+'px;height:'+STAGE_H+'px">';
  h += renderElsHtml(slide, true);
  h += '</div>';
  h += '<canvas id="drawCanvas" class="draw-canvas'+(isDrawTool?' active':'')+'"></canvas>';
  h += '</div>';

  // HUD counter (top right)
  h += '<div class="pres-hud">'+(S.presSlide+1)+' / '+S.slides.length+'</div>';

  // FLOATING PRESENTATION TOOLBAR
  h += '<div class="pres-bar pos-'+S.presBarPos+'" id="presBar">';
  // Prev/Next
  h += '<button class="tb-b" onclick="presPrev()" data-tip="Previous (←)">'+I.prev+'</button>';
  var curMaxRev = maxRevealStep(S.slides[S.presSlide]);
  var revealLabel = curMaxRev > 0 ? ' <span style="color:var(--o);font-size:10px;margin-left:4px">['+S.revealStep+'/'+curMaxRev+']</span>' : '';
  h += '<div class="pres-counter"><span>'+(S.presSlide+1)+'</span> / '+S.slides.length+revealLabel+'</div>';
  h += '<button class="tb-b" onclick="presNext()" data-tip="Next (→)">'+I.next+'</button>';
  h += '<div class="tb-sep"></div>';

  // Audio play/pause — only shown when current slide has audio attached AND
  // the per-slide "Show controls" toggle is on. Uses the toolbar (which is NOT
  // captured by the in-app recorder) so it stays out of any recording.
  var presSlideObj = S.slides[S.presSlide];
  var hasAudio = presSlideObj && presSlideObj.audio && presSlideObj.audio.data;
  var showAudioBtn = hasAudio && presSlideObj.audio.showControls !== false;
  if(showAudioBtn){
    var isPlaying = _slideAudio.audio && !_slideAudio.audio.paused && _slideAudio.slideId === presSlideObj.id;
    var audioIcon = isPlaying
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    var audioTip = isPlaying ? 'Pause voiceover' : 'Play voiceover';
    h += '<button class="tb-b'+(isPlaying?' a':'')+'" onclick="toggleSlideAudio()" data-tip="'+audioTip+'" style="'+(isPlaying?'color:var(--g)':'')+'">'+audioIcon+'</button>';
    h += '<div class="tb-sep"></div>';
  }

  // Annotation tools
  h += '<button class="tb-b'+(S.tool==='cursor'?' a':'')+'" onclick="setPresTool(\'cursor\')" data-tip="Pointer (C)">'+I.cursor+'</button>';
  h += '<button class="tb-b'+(S.tool==='pen'?' a':'')+'" onclick="setPresTool(\'pen\')" data-tip="Pen (P)">'+I.pen+'</button>';
  h += '<button class="tb-b'+(S.tool==='highlighter'?' a':'')+'" onclick="setPresTool(\'highlighter\')" data-tip="Highlighter (H)">'+I.hl+'</button>';
  h += '<button class="tb-b'+(S.tool==='eraser'?' a':'')+'" onclick="setPresTool(\'eraser\')" data-tip="Eraser (E)">'+I.eraser+'</button>';
  // Ink settings popover
  h += '<button class="tb-b'+(S.pop==='ink'?' a':'')+'" onclick="togglePresPop(\'ink\',event)" data-tip="Ink Settings"><div class="tb-swatch" style="background:'+S.penColor+'"></div></button>';
  // Clear
  h += '<button class="tb-b" onclick="presClearDraws()" data-tip="Clear Ink (X)">'+I.clear+'</button>';
  h += '<div class="tb-sep"></div>';
  // Laser pointer toggle
  h += '<button class="tb-b'+(S.laserActive?' a':'')+'" onclick="toggleLaser()" data-tip="Laser Pointer (L)" style="'+(S.laserActive?'color:#ff2a2a':'')+'">'+I.laser+'</button>';
  // Webcam toggle
  h += '<button class="tb-b'+(S.webcamActive?' a':'')+'" onclick="toggleWebcam()" data-tip="Webcam Overlay (W)" style="'+(S.webcamActive?'color:var(--g)':'')+'">'+I.webcam+'</button>';
  // Mic toggle (for recording)
  h += '<button class="tb-b" onclick="toggleRecAudio(event)" data-tip="Record audio: '+(S.recAudio?'ON':'OFF')+'" style="'+(S.recAudio?'color:var(--g)':'color:var(--muted)')+'">'+(S.recAudio?I.mic:I.micOff)+'</button>';
  // Record start/stop
  if(!S.recActive){
    h += '<button class="tb-b" onclick="startRecording()" data-tip="Start Recording slide (R)" style="color:#ff2a2a">'+I.record+'</button>';
  } else {
    h += '<button class="tb-b" onclick="pauseRecording()" data-tip="'+(S.recPaused?'Resume':'Pause')+' Recording" style="color:var(--o)">'+(S.recPaused?I.play:I.pause)+'</button>';
    h += '<button class="tb-b" onclick="stopRecording()" data-tip="Stop &amp; Save Recording" style="color:#ff2a2a">'+I.stop+'</button>';
  }
  h += '<div class="tb-sep"></div>';
  // Reposition toolbar
  h += '<button class="tb-b" onclick="cyclePresBarPos()" data-tip="Move toolbar ('+S.presBarPos+')" style="color:var(--gray)">'+I.move+'</button>';
  // Exit
  h += '<button class="tb-b" onclick="exitPresent()" data-tip="Exit (ESC)" style="color:var(--red)">'+I.exit+'</button>';
  h += '</div>';

  // Popover (ink settings in present mode)
  if(S.pop === 'ink' && S.popPos){
    h += renderInkPopover(true);
  }

  // WEBCAM OVERLAY
  if(S.webcamActive){
    h += '<div class="webcam-overlay corner-'+S.webcamCorner+'" id="webcamOverlay" style="width:'+S.webcamSize+'px;height:'+S.webcamSize+'px">';
    h += '<video id="webcamVideo" autoplay muted playsinline></video>';
    h += '<div class="webcam-controls">';
    h += '<button onclick="cycleWebcamCorner(event)" title="Move corner">⤡</button>';
    h += '<button onclick="resizeWebcam(-20, event)" title="Smaller">−</button>';
    h += '<button onclick="resizeWebcam(20, event)" title="Larger">+</button>';
    h += '</div></div>';
  }

  // RECORDING INDICATOR is rendered as a standalone element via ensureRecIndicator().
  // No inline render here.

  h += '</div>';
  app.innerHTML = h;

  // Re-attach webcam stream after re-render (srcObject doesn't serialize in innerHTML)
  if(S.webcamActive && S.webcamStream){
    var v = document.getElementById('webcamVideo');
    if(v){ v.srcObject = S.webcamStream; v.play().catch(function(){}); }
  }

  // Re-attach active screen-share streams too
  reattachScreenShareStreams();
  reattachWebcamStreams();

  // Mount TradingView widgets on current pres slide
  mountAllTradingViewOnSlide(S.slides[S.presSlide]);

  // Slide transitions: only fire when the slide ACTUALLY CHANGES (not on reveal clicks).
  // _lastTransSlideIdx tracks the last slide that triggered a transition.
  var stage = document.getElementById('presStage');
  var presRoot = stage ? stage.parentElement : null;
  var slideChanged = (window._lastTransSlideIdx !== S.presSlide);
  if(stage && presRoot && slideChanged){
    presRoot.classList.remove('ep-trans-fade','ep-trans-slide-left','ep-trans-slide-right','ep-trans-slide-up','ep-trans-slide-down','ep-trans-zoom','ep-trans-zoom-out','ep-trans-none');
    stage.classList.remove('ep-slide-transition');
    void stage.offsetHeight; // force reflow
    presRoot.classList.add('ep-trans-' + effTrans);
    stage.classList.add('ep-slide-transition');
    window._lastTransSlideIdx = S.presSlide;

    // Slide audio: stop any previous, autoplay if configured on this slide
    var curSlide = S.slides[S.presSlide];
    if(curSlide && curSlide.audio && curSlide.audio.data && curSlide.audio.autoplay){
      playSlideAudio(curSlide);
    } else {
      stopSlideAudio();
    }
  }

  initDrawCanvas();
}

// Reset slide transition tracker when entering / exiting presentation mode
window._resetSlideTransitionTracker = function(){
  window._lastTransSlideIdx = -1;
};

function reattachScreenShareStreams(){
  // For every element with an active stream, find its <video> and reattach srcObject
  var ids = Object.keys(_screenShareStreams);
  for(var i=0; i<ids.length; i++){
    var id = ids[i];
    var v = document.getElementById('ss-video-' + id);
    if(v && _screenShareStreams[id]){
      if(v.srcObject !== _screenShareStreams[id]){
        v.srcObject = _screenShareStreams[id];
        v.play().catch(function(){});
      }
    }
  }
}

// Mount every TradingView element on the given slide.
// Re-creates iframes from scratch on each render (acceptable — TV widgets have their own internal caching).
function mountAllTradingViewOnSlide(slide){
  if(!slide || !slide.els) return;
  for(var i=0; i<slide.els.length; i++){
    var el = slide.els[i];
    if(el.type === 'tradingview'){
      // Only mount if container exists & is empty (prevents re-init flicker on no-op rerenders)
      var c = document.getElementById('tv-container-' + el.id);
      if(c && !c.querySelector('iframe')){
        mountTradingViewWidget(el.id);
      }
    }
  }
}

// =========================================================
// BOOT
// =========================================================
var STARTUP_PREF_KEY = 'epPresenterStartupPref';
// Possible values:
//   null / 'ask'        → show the startup modal every launch (default)
//   'always-new'        → skip modal, start blank deck
//   'always-restore'    → skip modal, auto-restore the latest autosave if any

(function boot(){
  var savedDraft = loadAutoSave();
  var hasValidDraft = !!(savedDraft && savedDraft.slides && savedDraft.slides.length &&
    savedDraft.slides.some(function(s){ return (s.els && s.els.length) || (s.draws && s.draws.length); }));

  var pref = 'ask';
  try {
    var stored = localStorage.getItem(STARTUP_PREF_KEY);
    if(stored === 'always-new' || stored === 'always-restore') pref = stored;
  } catch(e){}

  // Fast paths: skip the modal if the user chose a durable preference
  if(pref === 'always-new'){
    finishBoot();
    return;
  }
  if(pref === 'always-restore' && hasValidDraft){
    applyDraft(savedDraft);
    finishBoot();
    return;
  }
  // No valid draft and no specific pref → just start blank silently
  if(!hasValidDraft){
    finishBoot();
    return;
  }

  // Otherwise show the startup modal
  showStartupModal(savedDraft, finishBoot);

  function applyDraft(d){
    S.slides = d.slides;
    S.si = Math.min(d.si || 0, S.slides.length - 1);
    S.slides.forEach(function(s){
      if(!s.draws) s.draws = [];
      if(!s.els) s.els = [];
      if(s.notes == null) s.notes = '';
    });
  }

  function finishBoot(){
    pushHist();
    render();
  }

  // Expose the applyDraft helper so the modal's Restore button can use it
  window._epApplyDraft = applyDraft;
})();

function showStartupModal(savedDraft, onDone){
  var ageMs = Date.now() - (savedDraft.savedAt || 0);
  var ageMin = Math.floor(ageMs / 60000);
  var ageText = ageMin < 1 ? 'less than a minute ago' :
                ageMin < 60 ? ageMin + ' minute' + (ageMin>1?'s':'') + ' ago' :
                Math.floor(ageMin/60) + ' hour' + (ageMin>=120?'s':'') + ' ago';
  var slideCount = savedDraft.slides.length;

  var overlay = document.createElement('div');
  overlay.id = 'ep-startup-overlay';
  overlay.innerHTML =
    '<div class="ep-startup-card">' +
      '<div class="ep-startup-logo">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:40px;height:40px;color:var(--g)"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/></svg>' +
      '</div>' +
      '<h2 class="ep-startup-title">Welcome to EP Presenter</h2>' +
      '<p class="ep-startup-sub">How would you like to start?</p>' +
      '<div class="ep-startup-opts">' +
        '<button class="ep-startup-opt" data-action="new">' +
          '<div class="ep-startup-opt-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>' +
          '<div class="ep-startup-opt-body"><div class="ep-startup-opt-t">New Deck</div><div class="ep-startup-opt-d">Start with a blank slide</div></div>' +
        '</button>' +
        '<button class="ep-startup-opt ep-startup-opt-primary" data-action="restore">' +
          '<div class="ep-startup-opt-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></div>' +
          '<div class="ep-startup-opt-body"><div class="ep-startup-opt-t">Restore Autosaved</div><div class="ep-startup-opt-d">' + slideCount + ' slide' + (slideCount>1?'s':'') + ' · saved ' + ageText + '</div></div>' +
        '</button>' +
        '<button class="ep-startup-opt" data-action="open">' +
          '<div class="ep-startup-opt-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>' +
          '<div class="ep-startup-opt-body"><div class="ep-startup-opt-t">Open from File…</div><div class="ep-startup-opt-d">Load a saved .json deck</div></div>' +
        '</button>' +
      '</div>' +
      '<label class="ep-startup-remember"><input type="checkbox" id="ep-startup-remember-cb"><span>Remember my choice and don\'t ask next time</span></label>' +
      '<div class="ep-startup-footer">You can change this later from <strong>File → Startup Preferences</strong></div>' +
    '</div>';
  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.getAttribute('data-action');
    var remember = document.getElementById('ep-startup-remember-cb').checked;

    if(action === 'new'){
      if(remember){ try { localStorage.setItem(STARTUP_PREF_KEY, 'always-new'); } catch(e){} }
      closeOverlay();
      onDone();
    } else if(action === 'restore'){
      if(remember){ try { localStorage.setItem(STARTUP_PREF_KEY, 'always-restore'); } catch(e){} }
      window._epApplyDraft(savedDraft);
      closeOverlay();
      onDone();
    } else if(action === 'open'){
      // Close overlay first, then trigger file picker
      closeOverlay();
      onDone();
      // Trigger the open file dialog
      setTimeout(function(){
        var inp = document.querySelector('input[type="file"][accept=".json"]');
        if(inp) inp.click();
        else if(typeof window.openPresentation === 'function') window.openPresentation();
      }, 100);
    }
  });

  function closeOverlay(){
    overlay.classList.add('closing');
    setTimeout(function(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 200);
  }
}

// Lets users reset their startup preference from a menu / keyboard shortcut
window.resetStartupPreference = function(){
  try { localStorage.removeItem(STARTUP_PREF_KEY); } catch(e){}
  showToast('Startup preference cleared — you will be asked next launch');
};

})();
</script>
</body>
</html>
