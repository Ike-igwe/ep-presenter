window.toggleWebcam = async function(){
  if(S.webcamActive){
    // Turn off
    if(S.webcamStream){
      try { S.webcamStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
    }
    S.webcamStream = null;
    S.webcamActive = false;
    renderPres();
    return;
  }
  // Turn on — request webcam
  try {
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showToast('Webcam not supported in this browser');
      return;
    }
    var stream = await navigator.mediaDevices.getUserMedia({
      video: { width: {ideal:640}, height: {ideal:480}, facingMode: 'user' },
      audio: false
    });
    S.webcamStream = stream;
    S.webcamActive = true;
    renderPres();
    // After render, attach stream to video element
    setTimeout(function(){
      var v = document.getElementById('webcamVideo');
      if(v){ v.srcObject = stream; v.play().catch(function(){}); }
    }, 50);
  } catch(e){
    console.error('Webcam failed:', e);
    if(e.name === 'NotAllowedError') showToast('Webcam permission denied');
    else if(e.name === 'NotFoundError') showToast('No webcam found');
    else showToast('Webcam error: ' + e.message);
  }
};

window.cycleWebcamCorner = function(evt){
  if(evt) evt.stopPropagation();
  var order = ['br','bl','tl','tr'];
  var i = order.indexOf(S.webcamCorner);
  S.webcamCorner = order[(i+1) % order.length];
  // Update DOM directly to avoid full re-render interrupting video
  var overlay = document.getElementById('webcamOverlay');
  if(overlay){
    overlay.className = 'webcam-overlay corner-' + S.webcamCorner;
  }
};

window.resizeWebcam = function(delta, evt){
  if(evt) evt.stopPropagation();
  S.webcamSize = Math.max(120, Math.min(400, S.webcamSize + delta));
  var overlay = document.getElementById('webcamOverlay');
  if(overlay){
    overlay.style.width = S.webcamSize + 'px';
    overlay.style.height = S.webcamSize + 'px';
  }
};

// =========================================================
// SCREEN RECORDING — canvas-composite: slide + annotations + webcam + audio
// =========================================================

// Cache of the current slide's rendered canvas (expensive to re-render each frame)
var _recSlideCache = { slideId:null, revealStep:-1, drawsRef:null, canvas:null, generation:0 };
var _recCacheGeneration = 0; // bumped on any invalidation — guarantees freshness

// Runtime-only: map of elementId → MediaStream for active screen shares.
// Not persisted; browsers can't rehydrate streams across reloads.
var _screenShareStreams = {};
// Runtime-only: map of webcam-element-id → MediaStream.
// Like screen shares, these are not persisted — browsers don't serialize MediaStreams.
var _webcamElStreams = {};

// Most recent rendered slide bitmap for the recording loop.
// Used regardless of cache policy so the compose frame always has SOMETHING to draw.
var _lastRecBitmap = null;

// Returns true if any element on the slide has a live screen-share stream.
// Slides with live screen shares can't use the bitmap cache — they need re-rendering every frame.
function slideHasLiveScreenShare(slide){
  if(!slide || !slide.els) return false;
  for(var i=0; i<slide.els.length; i++){
    var el = slide.els[i];
    if(el.type === 'screenshare' && _screenShareStreams[el.id]) return true;
  }
  return false;
}

async function getSlideBitmap(slide){
  // If slide has a live screen share, never use cache — stream content changes every frame
  var liveSS = slideHasLiveScreenShare(slide);

  // Cache is valid only if: no live screen share AND all identity checks match
  if(!liveSS &&
     _recSlideCache.canvas &&
     _recSlideCache.slideId === slide.id &&
     _recSlideCache.revealStep === S.revealStep &&
     _recSlideCache.drawsRef === slide.draws &&
     _recSlideCache.drawsLen === (slide.draws ? slide.draws.length : 0) &&
     _recSlideCache.generation === _recCacheGeneration){
    return _recSlideCache.canvas;
  }
  // Re-render
  var visibleEls = slide.els.filter(function(el){
    if(S.pres && el.reveal && el.reveal > S.revealStep) return false;
    return true;
  });
  var drawsCopy = (slide.draws || []).slice(); // snapshot to avoid mid-render mutation
  var slideClone = { id: slide.id, bg: slide.bg, els: visibleEls, draws: drawsCopy };
  var cv = await renderSlideToCanvas(slideClone, 1.333); // 1440*1.333 ≈ 1920
  // Only update cache when NOT live — storing a live-stream snapshot would be stale immediately
  if(!liveSS){
    _recSlideCache = {
      slideId: slide.id,
      revealStep: S.revealStep,
      drawsRef: slide.draws,
      drawsLen: drawsCopy.length,
      canvas: cv,
      generation: _recCacheGeneration
    };
  }
  return cv;
}

function invalidateRecCache(){
  _recCacheGeneration++;
  _recSlideCache = { slideId:null, revealStep:-1, drawsRef:null, drawsLen:-1, canvas:null, generation:-1 };
  _lastRecBitmap = null;
  console.log('[EP] Rec cache invalidated. New gen=' + _recCacheGeneration);
}

// Composite loop — runs every ~33ms (≈30fps) while recording.
// IMPORTANT: We use setInterval instead of requestAnimationFrame because RAF
// gets throttled or stopped entirely when the window is backgrounded, occluded,
// or loses focus. Recording during presentation often involves the editor
// window being behind a presenter view — RAF would stop firing and the canvas
// would emit no new frames, producing a blob with audio but a static frozen
// video stream (length reported as 00:00 because the encoder never sees motion).
function recComposeFrame(){
  if(!S.recActive || !S.recCanvas){
    if(S.recInterval){ clearInterval(S.recInterval); S.recInterval = null; }
    return;
  }
  if(S.recPaused) return; // setInterval keeps ticking; just skip drawing
  var cv = S.recCanvas;
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;

  // 1. Draw slide bitmap. Fire render to keep the "latest bitmap" always fresh.
  var slide = S.slides[S.presSlide];
  if(slide){
    // Kick off async render; updates _lastRecBitmap when done
    getSlideBitmap(slide).then(function(bm){
      _lastRecBitmap = bm;
    }).catch(function(){});
    // Draw whatever's currently latest
    if(_lastRecBitmap){
      ctx.drawImage(_lastRecBitmap, 0, 0, W, H);
    } else {
      ctx.fillStyle = slide.bg || '#111113';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // 2. Webcam overlay (if active) — composite over slide
  if(S.webcamActive && S.webcamStream){
    var v = document.getElementById('webcamVideo');
    if(v && v.readyState >= 2){
      var size = Math.round(S.webcamSize * (W / window.innerWidth) * 1.2);
      // Scale webcam size proportionally — 220px on 1400w screen ≈ ~300px on 1920 canvas
      size = Math.min(size, Math.floor(H * 0.35));
      var margin = Math.floor(size * 0.12);
      var px, py;
      if(S.webcamCorner === 'tl'){ px = margin; py = margin; }
      else if(S.webcamCorner === 'tr'){ px = W - size - margin; py = margin; }
      else if(S.webcamCorner === 'bl'){ px = margin; py = H - size - margin; }
      else { px = W - size - margin; py = H - size - margin; } // br
      ctx.save();
      ctx.beginPath();
      ctx.arc(px + size/2, py + size/2, size/2, 0, Math.PI*2);
      ctx.clip();
      // Mirror the video to match display
      ctx.translate(px + size, py);
      ctx.scale(-1, 1);
      try { ctx.drawImage(v, 0, 0, size, size); } catch(e){}
      ctx.restore();
      // Green ring
      ctx.save();
      ctx.strokeStyle = 'rgba(126,217,87,0.9)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(px + size/2, py + size/2, size/2 - 2, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
  }
  // Note: no RAF reschedule — setInterval handles the next tick.
}

function formatRecTime(ms){
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  s = s % 60;
  return (m<10?'0':'') + m + ':' + (s<10?'0':'') + s;
}

function currentRecMs(){
  if(!S.recActive) return 0;
  if(S.recPaused) return S.recElapsedBeforePause;
  return S.recElapsedBeforePause + (Date.now() - S.recStartTime);
}

// =========================================================
// RECORDING EXPORT DIALOG (format picker + ffmpeg conversion)
// =========================================================
// After a recording stops, we keep the WebM blob in memory and ask the user
// which format they want. WebM saves directly via blob download. MP4/MOV/GIF/MP3
// hand off to the Electron main process (which spawns bundled ffmpeg).
//
// Quality is a per-export setting. We probe ffmpeg encoders once per session
// and prefer hardware (NVENC/QSV/AMF) over CPU (libx264). Users can see the
// detected encoder so they understand why exports are fast or slow.

// Cached encoder list + chosen quality (stickies between dialogs)
var _epEncoderList = null;
var _epLastQuality = null; // 'fast' | 'balanced' | 'high'

function epEncoderHumanName(enc){
  switch(enc){
    case 'h264_nvenc': return 'NVIDIA GPU';
    case 'h264_qsv':   return 'Intel GPU';
    case 'h264_amf':   return 'AMD GPU';
    case 'libx264':    return 'CPU';
    default:           return enc;
  }
}

function showRecordingExportDialog(blob, durStr){
  var hasFfmpeg = !!(window.epElectron && window.epElectron.convertVideo);
  var sizeStr = (blob.size / 1024 / 1024).toFixed(1) + ' MB';
  var suggestedName = 'ep-recording-' + Date.now();
  var quality = _epLastQuality || 'fast';

  // Kick off encoder probe (cached across the session)
  if(hasFfmpeg && !_epEncoderList && window.epElectron.probeEncoders){
    window.epElectron.probeEncoders().then(function(list){
      _epEncoderList = list || ['libx264'];
      // Update the badge in-place if dialog is still open
      var badge = document.getElementById('epEncoderBadge');
      if(badge) badge.textContent = epEncoderHumanName(_epEncoderList[0]);
    }).catch(function(){ _epEncoderList = ['libx264']; });
  }

  var overlay = document.createElement('div');
  overlay.id = 'ep-export-dialog';
  overlay.className = 'ep-export-overlay';

  var formats = [
    { v:'webm', l:'WebM',  d:'Native, no conversion. Instant.', recommended:false, icon:'⚡', always:true },
    { v:'mp4',  l:'MP4',   d:'H.264 + AAC. Best for After Effects, Camtasia, YouTube.', recommended:true,  icon:'🎬' },
    { v:'mov',  l:'MOV',   d:'QuickTime container, H.264 + AAC.', recommended:false, icon:'🎞️' },
    { v:'gif',  l:'GIF',   d:'Short clips only. Quality affects size dramatically.', recommended:false, icon:'🌀' },
    { v:'mp3',  l:'MP3',   d:'Audio only (strips video).', recommended:false, icon:'🎵' }
  ];

  var qualities = [
    { v:'fast',     l:'Fast',     d:'Quick exports, larger files. Best for daily lessons.' },
    { v:'balanced', l:'Balanced', d:'Good size + quality. Default for most uses.' },
    { v:'high',     l:'High',     d:'Slow but smallest, best for final renders.' }
  ];

  var encName = _epEncoderList ? epEncoderHumanName(_epEncoderList[0]) : 'detecting…';

  var html = '<div class="ep-export-card">';
  html += '<div class="ep-export-header"><h2>Export Recording</h2><button class="ep-export-close" onclick="closeExportDialog(true)" title="Cancel">&times;</button></div>';
  html += '<div class="ep-export-info">Length: <strong>'+durStr+'</strong> · Size: <strong>'+sizeStr+'</strong> · Encoder: <strong id="epEncoderBadge">'+encName+'</strong></div>';
  html += '<div class="ep-export-body">';

  // Quality picker (only relevant when ffmpeg is in play)
  if(hasFfmpeg){
    html += '<div class="ep-export-q">Quality</div>';
    html += '<div class="ep-export-quality-row">';
    qualities.forEach(function(q){
      var active = quality === q.v;
      html += '<button class="ep-export-quality-btn'+(active?' active':'')+'" onclick="setExportQuality(\''+q.v+'\')" title="'+esc(q.d)+'">';
      html += '<div class="ep-export-quality-name">'+q.l+'</div>';
      html += '<div class="ep-export-quality-desc">'+q.d+'</div>';
      html += '</button>';
    });
    html += '</div>';
  }

  html += '<div class="ep-export-q">Format</div>';
  formats.forEach(function(f){
    var disabled = !f.always && !hasFfmpeg;
    var disabledLabel = disabled ? '<span style="color:var(--muted);font-size:10px;margin-left:6px">(needs Electron build)</span>' : '';
    var recBadge = f.recommended ? '<span class="ep-export-rec">RECOMMENDED</span>' : '';
    html += '<button class="ep-export-fmt'+(disabled?' disabled':'')+(f.recommended?' recommended':'')+'" '+(disabled?'disabled':'')+' data-format="'+f.v+'" onclick="handleExportFormat(\''+f.v+'\')">';
    html += '<div class="ep-export-fmt-icon">'+f.icon+'</div>';
    html += '<div class="ep-export-fmt-text">';
    html += '<div class="ep-export-fmt-name">'+f.l+recBadge+disabledLabel+'</div>';
    html += '<div class="ep-export-fmt-desc">'+f.d+'</div>';
    html += '</div>';
    html += '</button>';
  });
  html += '</div>';
  // Progress area (hidden until conversion starts)
  html += '<div class="ep-export-progress" id="epExportProgress" style="display:none">';
  html += '<div class="ep-export-progress-label" id="epExportProgressLabel">Converting…</div>';
  html += '<div class="ep-export-progress-bar"><div class="ep-export-progress-fill" id="epExportProgressFill"></div></div>';
  html += '<div class="ep-export-progress-pct" id="epExportProgressPct">0%</div>';
  html += '</div>';
  html += '</div>';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);

  overlay._epBlob = blob;
  overlay._epSuggestedName = suggestedName;
  overlay._epDurStr = durStr;
  overlay._epQuality = quality;

  overlay._epKeyHandler = function(e){
    if(e.key === 'Escape' && !overlay._epConverting) closeExportDialog(true);
  };
  document.addEventListener('keydown', overlay._epKeyHandler);
}

window.setExportQuality = function(q){
  var overlay = document.getElementById('ep-export-dialog');
  if(!overlay) return;
  overlay._epQuality = q;
  _epLastQuality = q;
  // Re-style buttons
  var btns = overlay.querySelectorAll('.ep-export-quality-btn');
  for(var i=0; i<btns.length; i++){
    var btn = btns[i];
    var isActive = btn.getAttribute('onclick').indexOf("'"+q+"'") >= 0;
    btn.classList.toggle('active', isActive);
  }
};

window.closeExportDialog = function(userCancelled){
  var overlay = document.getElementById('ep-export-dialog');
  if(!overlay) return;
  if(overlay._epKeyHandler) document.removeEventListener('keydown', overlay._epKeyHandler);
  overlay.remove();
  if(userCancelled) showToast('Export cancelled');
};

window.handleExportFormat = async function(format){
  var overlay = document.getElementById('ep-export-dialog');
  if(!overlay) return;
  var blob = overlay._epBlob;
  var name = overlay._epSuggestedName;
  var quality = overlay._epQuality || 'fast';
  if(!blob) return;

  // WebM: skip ffmpeg, save directly
  if(format === 'webm'){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name + '.webm';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    closeExportDialog(false);
    showToast('Recording saved (WebM)');
    return;
  }

  // Other formats need Electron
  if(!window.epElectron || !window.epElectron.convertVideo){
    showToast('Conversion only works in the desktop app');
    return;
  }

  // Switch UI to "converting" state
  overlay._epConverting = true;
  var progressBox = document.getElementById('epExportProgress');
  var progressFill = document.getElementById('epExportProgressFill');
  var progressPct = document.getElementById('epExportProgressPct');
  var progressLabel = document.getElementById('epExportProgressLabel');
  if(progressBox) progressBox.style.display = 'block';
  if(progressLabel) progressLabel.textContent = 'Converting to ' + format.toUpperCase() + ' (' + quality + ')…';
  // Disable all format buttons
  var btns = overlay.querySelectorAll('.ep-export-fmt, .ep-export-quality-btn');
  for(var bi=0; bi<btns.length; bi++){
    btns[bi].disabled = true;
    btns[bi].style.opacity = '0.4';
    btns[bi].style.cursor = 'not-allowed';
  }
  var closeBtn = overlay.querySelector('.ep-export-close');
  if(closeBtn) closeBtn.style.display = 'none';

  // Subscribe to progress
  var unsubscribe = window.epElectron.onConvertProgress(function(data){
    if(progressFill && data.pct != null){
      progressFill.style.width = data.pct + '%';
      if(progressPct) progressPct.textContent = data.pct + '%';
    }
    // GPU encoder fell back to CPU — let the user know
    if(data.fellBack && progressLabel){
      progressLabel.textContent = 'GPU encoder failed — retrying with CPU…';
    } else if(data.encoder && progressLabel && !data.fellBack){
      progressLabel.textContent = 'Converting to ' + format.toUpperCase() + ' (' + quality + ', ' + epEncoderHumanName(data.encoder) + ')…';
    }
  });

  try {
    var arrayBuffer = await blob.arrayBuffer();
    var result = await window.epElectron.convertVideo(arrayBuffer, format, name, { quality: quality });
    if(unsubscribe) unsubscribe();
    if(result && result.ok){
      if(progressFill) progressFill.style.width = '100%';
      if(progressPct) progressPct.textContent = '100%';
      if(progressLabel) progressLabel.textContent = 'Done!';
      showToast('Saved: ' + result.outputPath);
      setTimeout(function(){
        if(window.epElectron && window.epElectron.showInFolder) {
          window.epElectron.showInFolder(result.outputPath);
        }
        closeExportDialog(false);
      }, 800);
    } else if(result && result.canceled){
      // User cancelled save dialog — restore picker UI
      overlay._epConverting = false;
      if(progressBox) progressBox.style.display = 'none';
      for(var bi2=0; bi2<btns.length; bi2++){
        btns[bi2].disabled = btns[bi2].classList.contains('disabled');
        btns[bi2].style.opacity = '';
        btns[bi2].style.cursor = '';
      }
      if(closeBtn) closeBtn.style.display = '';
    } else {
      var msg = (result && result.error) || 'Conversion failed';
      if(progressLabel) progressLabel.textContent = 'Failed: ' + msg;
      showToast('Export failed: ' + msg);
      overlay._epConverting = false;
      for(var bi3=0; bi3<btns.length; bi3++){
        btns[bi3].disabled = btns[bi3].classList.contains('disabled');
        btns[bi3].style.opacity = '';
        btns[bi3].style.cursor = '';
      }
      if(closeBtn) closeBtn.style.display = '';
    }
  } catch(err){
    if(unsubscribe) unsubscribe();
    console.error('Export error:', err);
    showToast('Export error: ' + (err.message || err));
    overlay._epConverting = false;
    if(closeBtn) closeBtn.style.display = '';
  }
};

// Update indicator time display every second
function tickRecIndicator(){
  if(!S.recActive && !S._recStopping){
    // Ensure indicator is removed when recording stops AND finalization is done
    var existing = document.getElementById('recIndicator');
    if(existing) existing.remove();
    return;
  }
  ensureRecIndicator();
  var el = document.getElementById('recTime');
  if(el) el.textContent = formatRecTime(currentRecMs());
  setTimeout(tickRecIndicator, 250);
}

function ensureRecIndicator(){
  var ind = document.getElementById('recIndicator');
  if(!ind){
    ind = document.createElement('div');
    ind.id = 'recIndicator';
    ind.className = 'rec-indicator';
    document.body.appendChild(ind);
  }
  ind.innerHTML =
    '<div class="rec-dot'+(S.recPaused?' paused':'')+'"></div>' +
    '<span>'+(S.recPaused?'PAUSED':(S._recStopping?'STOPPING':'REC'))+'</span>' +
    '<span class="rec-time" id="recTime">'+formatRecTime(currentRecMs())+'</span>' +
    '<button onclick="pauseRecording()"'+(S._recStopping?' disabled style="opacity:0.4;cursor:not-allowed"':'')+'>'+(S.recPaused?'Resume':'Pause')+'</button>' +
    '<button class="stop" onclick="stopRecording()"'+(S._recStopping?' disabled style="opacity:0.4;cursor:not-allowed"':'')+'>'+(S._recStopping?'Stopping…':'Stop')+'</button>';
}

window.toggleRecAudio = function(evt){
  if(evt) evt.stopPropagation();
  S.recAudio = !S.recAudio;
  showToast('Mic audio: ' + (S.recAudio ? 'ON' : 'OFF') + (S.recActive ? ' (applies to next recording)' : ''));
  // Can't change audio mid-recording without restart; just re-render the toolbar
  if(S.pres) renderPres();
  else render();
};

window.startRecording = async function(){
  if(S.recActive){ return; }
  if(!S.pres){ showToast('Start recording from presentation mode'); return; }

  // Detect whether any slide has audio attached — only then prompt
  var hasAnyAudio = S.slides.some(function(s){ return s.audio && s.audio.data; });
  var includeAudio = false;
  if(hasAnyAudio){
    includeAudio = confirm('Include slide voiceovers in the recording?\n\nClick OK to record narration audio together with the screen.\nClick Cancel for video only (or with mic if enabled).');
  }
  S.recIncludeSlideAudio = includeAudio;

  try {
    // 1. Create canvas (1920×1080)
    var cv = document.createElement('canvas');
    cv.width = 1920; cv.height = 1080;
    S.recCanvas = cv;

    // Force-clear the canvas pixels (defensive: new canvases default transparent, but be explicit)
    var primeCtx = cv.getContext('2d');
    primeCtx.fillStyle = '#000';
    primeCtx.fillRect(0, 0, cv.width, cv.height);

    // Prime the first frame before stream starts
    invalidateRecCache();
    var slide = S.slides[S.presSlide];
    if(slide){
      var bm = await getSlideBitmap(slide);
      primeCtx.drawImage(bm, 0, 0, cv.width, cv.height);
    }

    // 2. Set up composited stream: canvas video + optional mic + optional slide voiceover.
    // When slide audio mixing is requested, we build an AudioContext destination that
    // both mic and slide-audio tracks can feed into.
    var videoStream = cv.captureStream(30);
    var combinedStream = new MediaStream();
    videoStream.getVideoTracks().forEach(function(t){ combinedStream.addTrack(t); });

    // AudioContext-based mixer (only created when needed)
    if(S.recAudio || includeAudio){
      try {
        S.recAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        S.recAudioDest = S.recAudioCtx.createMediaStreamDestination();

        // Route mic if requested
        if(S.recAudio){
          try {
            S.recAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            var micSrc = S.recAudioCtx.createMediaStreamSource(S.recAudioStream);
            micSrc.connect(S.recAudioDest);
          } catch(e){
            console.warn('Mic denied or unavailable, recording without mic:', e);
            showToast('Mic unavailable — continuing without mic');
            S.recAudioStream = null;
          }
        }

        // Route slide voiceover audio if requested.
        // We hook the existing _slideAudio.audio element. When playSlideAudio
        // creates a new <audio>, we need to also route it through the mixer.
        // _routeSlideAudioToMixer is checked by playSlideAudio after it creates
        // each element.
        S.recRouteSlideAudio = !!includeAudio;

        // Add the destination's audio track
        S.recAudioDest.stream.getAudioTracks().forEach(function(t){
          combinedStream.addTrack(t);
        });
      } catch(e){
        console.error('Audio mixer setup failed:', e);
        showToast('Audio setup failed — recording video only');
        S.recAudioStream = null;
        S.recAudioCtx = null;
      }
    }

    // 3. Set up MediaRecorder — prefer vp9, fallback vp8, fallback default
    var mimeType = '';
    var candidates = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm;codecs=vp9','video/webm'];
    for(var ci=0; ci<candidates.length; ci++){
      if(typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(candidates[ci])){
        mimeType = candidates[ci]; break;
      }
    }
    if(!mimeType){
      showToast('MediaRecorder not supported in this browser');
      return;
    }
    S.recChunks = [];
    var rec = new MediaRecorder(combinedStream, { mimeType: mimeType, videoBitsPerSecond: 5000000 });
    rec.ondataavailable = function(e){
      if(e.data && e.data.size > 0) S.recChunks.push(e.data);
    };
    rec.onstop = function(){
      // Guard against double-fire (defensive timeout in stopRecording may have invoked us)
      if(rec._epFinalized) return;
      rec._epFinalized = true;
      S._recStopping = false;
      // Trigger the indicator's removal cycle
      tickRecIndicator();
      var blob = new Blob(S.recChunks, { type: 'video/webm' });
      // Clean up resources first so they don't leak while user picks format
      if(S.recAudioStream){
        try { S.recAudioStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
        S.recAudioStream = null;
      }
      if(S.recAudioCtx){
        try { S.recAudioCtx.close(); } catch(e){}
        S.recAudioCtx = null;
        S.recAudioDest = null;
      }
      S.recRouteSlideAudio = false;
      S.recChunks = [];
      S.recCanvas = null;
      var durStr = formatRecTime(currentRecMs());
      // Show format picker; user chooses WebM (direct), MP4, MOV, GIF, or MP3
      showRecordingExportDialog(blob, durStr);
    };
    S.recorder = rec;
    rec.start(1000); // emit chunks every 1s

    // 4. Start compositor loop
    S.recActive = true;
    S.recPaused = false;
    S.recStartTime = Date.now();
    S.recElapsedBeforePause = 0;
    // setInterval at ~33ms (~30fps) — survives window backgrounding, unlike RAF.
    if(S.recInterval){ clearInterval(S.recInterval); }
    S.recInterval = setInterval(recComposeFrame, 33);
    // Run one frame immediately so the canvas isn't blank before the first interval tick
    recComposeFrame();
    renderPres();
    tickRecIndicator();
    showToast('Recording started' + (S.recAudio && S.recAudioStream ? ' (with mic)' : ' (video only)'));
  } catch(e){
    console.error('Recording failed:', e);
    showToast('Recording failed: ' + e.message);
    S.recActive = false;
    S.recorder = null;
  }
};

window.pauseRecording = function(){
  if(!S.recActive || !S.recorder) return;
  if(S.recPaused){
    try { S.recorder.resume(); } catch(e){}
    S.recStartTime = Date.now();
    S.recPaused = false;
  } else {
    try { S.recorder.pause(); } catch(e){}
    S.recElapsedBeforePause += Date.now() - S.recStartTime;
    S.recPaused = true;
  }
  ensureRecIndicator();
  if(S.pres) renderPres();
};

window.stopRecording = function(){
  // Re-entrancy guard: ignore subsequent clicks while a stop is in progress.
  if(S._recStopping) return;
  if(!S.recActive || !S.recorder) return;
  S._recStopping = true;
  // Stop the compositor interval immediately so canvas stops emitting frames.
  if(S.recInterval){ clearInterval(S.recInterval); S.recInterval = null; }
  if(S.recRAF){ try{ cancelAnimationFrame(S.recRAF); }catch(e){} S.recRAF = null; }
  // Tell MediaRecorder to flush remaining data, then stop.
  // requestData() forces an ondataavailable so the final 0-1 second isn't lost.
  try {
    if(S.recorder.state !== 'inactive'){
      try { S.recorder.requestData(); } catch(e){}
      S.recorder.stop();
    }
  } catch(e){
    console.warn('stop() failed:', e);
    // Even if stop throws, run onstop manually so user gets their blob.
    if(typeof S.recorder.onstop === 'function'){
      try { S.recorder.onstop(); } catch(e2){}
    }
  }
  // Defensive timeout: if onstop doesn't fire within 4s, force-finalize so the
  // user isn't stuck with the indicator removed but no export dialog.
  setTimeout(function(){
    if(S._recStopping && S.recChunks && S.recChunks.length){
      console.warn('onstop never fired — finalizing manually');
      try {
        if(S.recorder && typeof S.recorder.onstop === 'function') S.recorder.onstop();
      } catch(e){}
    }
    S._recStopping = false;
  }, 4000);
  S.recActive = false;
  S.recPaused = false;
  if(S.pres) renderPres();
  else render();
};


// Count distinct reveal groups on a slide (elements with reveal > 0, unique steps)
function maxRevealStep(slide){
  if(!slide || !slide.els) return 0;
  var max = 0;
  slide.els.forEach(function(el){
    if(el.reveal && el.reveal > max) max = el.reveal;
    // Also count per-item reveals on list elements
    if(el.type === 'list' && el.items){
      el.items.forEach(function(it){
        if(it.reveal && it.reveal > max) max = it.reveal;
      });
    }
  });
  return max;
}

window.presNext = function(){
  var slide = S.slides[S.presSlide];
  var maxStep = maxRevealStep(slide);
  if(S.revealStep < maxStep){
    S.revealStep++;
    invalidateRecCache();
    if(S.recActive) prewarmRecCache();
    renderPres();
    syncPresenterView();
    return;
  }
  if(S.presSlide < S.slides.length - 1){
    S.presSlide++;
    S.revealStep = 0;
    S.pop = null;
    invalidateRecCache();
    if(S.recActive) prewarmRecCache();
    renderPres();
    syncPresenterView();
  }
};

window.presPrev = function(){
  if(S.revealStep > 0){
    S.revealStep--;
    invalidateRecCache();
    if(S.recActive) prewarmRecCache();
    renderPres();
    syncPresenterView();
    return;
  }
  if(S.presSlide > 0){
    S.presSlide--;
    S.revealStep = maxRevealStep(S.slides[S.presSlide]);
    S.pop = null;
    invalidateRecCache();
    if(S.recActive) prewarmRecCache();
    renderPres();
    syncPresenterView();
  }
};

window.presClearDraws = function(){
  S.slides[S.presSlide].draws = [];
  invalidateRecCache();
  if(S.recActive) prewarmRecCache();
  pushHist();
  renderPres();
};

// Pre-warm the recording cache so the next frame has a bitmap ready.
// Runs async — the compose loop uses whatever's currently in cache; this just speeds up cache population.
function prewarmRecCache(){
  var slide = S.slides[S.presSlide];
  if(slide) getSlideBitmap(slide).catch(function(e){ console.warn('[EP] prewarm failed:', e); });
}

// =========================================================
// DRAWING (Canvas-based annotations)
// =========================================================
function initDrawCanvas(){
  drawCanvas = document.getElementById('drawCanvas');
  if(!drawCanvas) return;
  var parent = drawCanvas.parentElement;
  if(!parent) return;
  drawCanvas.width = parent.offsetWidth;
  drawCanvas.height = parent.offsetHeight;
  drawCtx = drawCanvas.getContext('2d');
  redrawStrokes();
}

function redrawStrokes(){
  if(!drawCtx || !drawCanvas) return;
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  var slide = S.pres ? S.slides[S.presSlide] : cs();
  var draws = (slide && slide.draws) || [];
  var scale = S.pres ? S.stageScale : S.stageScale;
  for(var i=0; i<draws.length; i++){
    var d = draws[i];
    if(!d.pts || d.pts.length < 2) continue;
    drawCtx.beginPath();
    drawCtx.moveTo(d.pts[0].x * scale, d.pts[0].y * scale);
    for(var j=1; j<d.pts.length; j++){
      drawCtx.lineTo(d.pts[j].x * scale, d.pts[j].y * scale);
    }
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    if(d.tool === 'eraser'){
      drawCtx.strokeStyle = 'rgba(0,0,0,1)';
      drawCtx.lineWidth = d.size * scale;
      drawCtx.globalCompositeOperation = 'destination-out';
      drawCtx.globalAlpha = 1;
    } else {
      drawCtx.strokeStyle = d.color;
      drawCtx.lineWidth = d.size * scale;
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.globalAlpha = (d.opacity || 100) / 100;
    }
    drawCtx.stroke();
  }
  drawCtx.globalAlpha = 1;
  drawCtx.globalCompositeOperation = 'source-over';
}

function getStagePoint(evt){
  var r = drawCanvas.getBoundingClientRect();
  return {
    x: (evt.clientX - r.left) / S.stageScale,
    y: (evt.clientY - r.top) / S.stageScale
  };
}

function startDraw(evt){
  if(S.tool !== 'pen' && S.tool !== 'highlighter' && S.tool !== 'eraser') return;
  isDrawing = true;
  currentStroke = [getStagePoint(evt)];
}

function moveDraw(evt){
  if(!isDrawing) return;
  var pt = getStagePoint(evt);
  currentStroke.push(pt);
  if(currentStroke.length < 2) return;
  // Draw live segment
  var prev = currentStroke[currentStroke.length-2];
  drawCtx.beginPath();
  drawCtx.moveTo(prev.x * S.stageScale, prev.y * S.stageScale);
  drawCtx.lineTo(pt.x * S.stageScale, pt.y * S.stageScale);
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  var t = S.tool;
  if(t === 'eraser'){
    drawCtx.strokeStyle = 'rgba(0,0,0,1)';
    drawCtx.lineWidth = S.penSize * 4 * S.stageScale;
    drawCtx.globalCompositeOperation = 'destination-out';
    drawCtx.globalAlpha = 1;
  } else {
    drawCtx.strokeStyle = S.penColor;
    drawCtx.lineWidth = S.penSize * S.stageScale;
    drawCtx.globalCompositeOperation = 'source-over';
    drawCtx.globalAlpha = t === 'highlighter' ? (S.penOpacity/100) * 0.4 : S.penOpacity/100;
  }
  drawCtx.stroke();
  drawCtx.globalAlpha = 1;
  drawCtx.globalCompositeOperation = 'source-over';
}

function endDraw(){
  if(!isDrawing) return;
  isDrawing = false;
  if(currentStroke.length > 1){
    var t = S.tool;
    var stroke = {
      id: uid(),
      pts: currentStroke.slice(),
      color: t === 'eraser' ? 'eraser' : S.penColor,
      size: t === 'eraser' ? S.penSize * 4 : S.penSize,
      opacity: t === 'highlighter' ? S.penOpacity * 0.4 : S.penOpacity,
      tool: t
    };
    var targetSlide = S.pres ? S.slides[S.presSlide] : cs();
    targetSlide.draws.push(stroke);
    if(typeof invalidateRecCache === 'function') invalidateRecCache();
    pushHist();
  }
  currentStroke = [];
}

// =========================================================
// CANVAS MOUSE HANDLERS
// =========================================================
window.onCanvasDown = function(evt){
  if(S.tool === 'pen' || S.tool === 'highlighter' || S.tool === 'eraser'){
    startDraw(evt);
    return;
  }
  if(S.tool === 'select'){
    S.sel = null;
    S.ed = null;
    S.ctxMenu = null;
    S.pop = null;
    render();
  }
};

// Mouse move & up handlers (installed once)
document.addEventListener('mousemove', function(evt){
  // Pen cursor tracker
  if((S.tool==='pen' || S.tool==='highlighter' || S.tool==='eraser') && !S.pop){
    updatePenCursor(evt);
  } else {
    hidePenCursor();
  }

  if(drag){
    var primary = gEl(drag.id);
    if(!primary) return;
    var stageRect = document.getElementById('canvasStage').getBoundingClientRect();
    // Compute proposed delta based on primary element's intended position
    var proposedX, proposedY;
    if(primary.type === 'line'){
      proposedX = (evt.clientX - stageRect.left) / S.stageScale - drag.primaryAnchorX;
      proposedY = (evt.clientY - stageRect.top) / S.stageScale - drag.primaryAnchorY;
    } else {
      proposedX = (evt.clientX - stageRect.left) / S.stageScale - drag.ox;
      proposedY = (evt.clientY - stageRect.top) / S.stageScale - drag.oy;
    }
    var proposedDx = proposedX - drag.primaryStartX;
    var proposedDy = proposedY - drag.primaryStartY;
    // Apply snap
    var snap = computeSnap(drag.ids, proposedDx, proposedDy);
    S.snapGuides = snap.guides;
    // Apply delta to every dragged element from its original snapshot
    drag.ids.forEach(function(id){
      var el = gEl(id);
      if(!el) return;
      var orig = drag.origPositions[id];
      if(el.type === 'line'){
        el.x1 = orig.x1 + snap.dx; el.y1 = orig.y1 + snap.dy;
        el.x2 = orig.x2 + snap.dx; el.y2 = orig.y2 + snap.dy;
      } else {
        el.x = orig.x + snap.dx;
        el.y = orig.y + snap.dy;
      }
    });
    renderEls();
    renderSnapGuides();
    return;
  }
  if(resize){
    var el2 = gEl(resize.id);
    if(!el2) return;
    var dx = (evt.clientX - resize.sx) / S.stageScale;
    var dy = (evt.clientY - resize.sy) / S.stageScale;
    var c = resize.corner;
    var shift = evt.shiftKey;
    var alt = evt.altKey;
    var isCorner = (c.length === 2); // nw, ne, sw, se
    var aspect = resize.ow / resize.oh;

    // Figure out new w/h based on corner
    var newW = resize.ow, newH = resize.oh, newX = resize.ox, newY = resize.oy;

    if(c.indexOf('e') >= 0){ newW = resize.ow + dx; }
    if(c.indexOf('w') >= 0){ newW = resize.ow - dx; newX = resize.ox + dx; }
    if(c.indexOf('s') >= 0){ newH = resize.oh + dy; }
    if(c.indexOf('n') >= 0){ newH = resize.oh - dy; newY = resize.oy + dy; }

    // Shift = constrain aspect (corner handles only)
    if(shift && isCorner){
      // Pick which axis drove the change more and match the other to it
      var wRatio = newW / resize.ow;
      var hRatio = newH / resize.oh;
      if(Math.abs(wRatio - 1) > Math.abs(hRatio - 1)){
        newH = newW / aspect;
        if(c.indexOf('n') >= 0) newY = resize.oy + (resize.oh - newH);
      } else {
        newW = newH * aspect;
        if(c.indexOf('w') >= 0) newX = resize.ox + (resize.ow - newW);
      }
    }

    // Alt = resize from center (mirror size change on opposite side)
    if(alt){
      var cx = resize.ox + resize.ow/2;
      var cy = resize.oy + resize.oh/2;
      newX = cx - newW/2;
      newY = cy - newH/2;
    }

    // Minimums
    if(newW < 20){ newW = 20; if(c.indexOf('w')>=0) newX = resize.ox + resize.ow - 20; }
    if(newH < 20){ newH = 20; if(c.indexOf('n')>=0) newY = resize.oy + resize.oh - 20; }

    el2.w = newW; el2.h = newH; el2.x = newX; el2.y = newY;
    renderEls();
    return;
  }
  if(epDrag){
    var el3 = gEl(epDrag.id);
    if(!el3) return;
    var stageRect2 = document.getElementById('canvasStage').getBoundingClientRect();
    var px = (evt.clientX - stageRect2.left) / S.stageScale;
    var py = (evt.clientY - stageRect2.top) / S.stageScale;
    if(epDrag.pt === 1){ el3.x1 = px; el3.y1 = py; }
    else { el3.x2 = px; el3.y2 = py; }
    renderEls();
    return;
  }
  if(isDrawing) moveDraw(evt);
});

document.addEventListener('mouseup', function(){
  if(drag){
    pushHist();
    drag = null;
    S.snapGuides = [];
    renderSnapGuides();
  }
  if(resize){ pushHist(); resize = null; }
  if(epDrag){ pushHist(); epDrag = null; }
  if(isDrawing) endDraw();
});

// Pen cursor
function updatePenCursor(evt){
  if(!penCursorEl){
    penCursorEl = document.createElement('div');
    penCursorEl.className = 'pen-cursor';
    document.body.appendChild(penCursorEl);
  }
  var sz = (S.tool === 'eraser' ? S.penSize * 4 : S.penSize) * S.stageScale;
  penCursorEl.style.width = sz + 'px';
  penCursorEl.style.height = sz + 'px';
  penCursorEl.style.left = evt.clientX + 'px';
  penCursorEl.style.top = evt.clientY + 'px';
  penCursorEl.style.borderColor = S.tool === 'eraser' ? '#f43f5e' : S.penColor;
  penCursorEl.style.background = S.tool === 'highlighter' ? S.penColor + '40' : 'transparent';
  penCursorEl.style.display = 'block';
}
function hidePenCursor(){ if(penCursorEl) penCursorEl.style.display = 'none'; }

// =========================================================
// ELEMENT INTERACTION
// =========================================================
var lastClick = {id:null, time:0};

window.startElDrag = function(evt, id){
  if(S.tool !== 'select') return;
  evt.stopPropagation();
  var el = gEl(id);
  if(!el) return;
  // Shift-click: toggle selection, don't start drag
  if(evt.shiftKey){
    toggleSelect(id);
    // Expand toggled selection to whole groups
    S.selIds = expandSelectionToGroups(S.selIds);
    render();
    return;
  }
  // Locked: select only (entire group if grouped), no drag
  if(el.lk){
    S.selIds = expandSelectionToGroups([id]);
    S.ctxMenu = null; S.pop = null;
    render();
    return;
  }
  var now = Date.now();
  if(lastClick.id === id && now - lastClick.time < 400){
    lastClick = {id:null, time:0};
    drag = null;
    startEdit(id);
    return;
  }
  lastClick = {id:id, time:now};
  // If clicking on an already-selected element in a multi-selection, keep selection
  // Otherwise select only this one (expanded to its group if any)
  if(S.selIds.indexOf(id) < 0){
    S.selIds = expandSelectionToGroups([id]);
  } else {
    // Already in selection — make sure group siblings are still in there
    S.selIds = expandSelectionToGroups(S.selIds);
  }
  S.ctxMenu = null;
  S.pop = null;
  var stageRect = document.getElementById('canvasStage').getBoundingClientRect();
  // Build drag state for ALL selected elements (for multi-drag)
  var dragIds = S.selIds.filter(function(sid){
    var e = gEl(sid);
    return e && !e.lk;
  });
  // Snapshot original positions
  var origPositions = {};
  dragIds.forEach(function(sid){
    var e = gEl(sid);
    if(e.type === 'line'){
      origPositions[sid] = {x1:e.x1, y1:e.y1, x2:e.x2, y2:e.y2};
    } else {
      origPositions[sid] = {x:e.x, y:e.y};
    }
  });
  // Primary element tracking (mouse position relative to primary)
  var primaryStartX, primaryStartY, primaryAnchorX, primaryAnchorY;
  if(el.type === 'line'){
    primaryStartX = el.x1;
    primaryStartY = el.y1;
    primaryAnchorX = (evt.clientX - stageRect.left) / S.stageScale - el.x1;
    primaryAnchorY = (evt.clientY - stageRect.top) / S.stageScale - el.y1;
  } else {
    primaryStartX = el.x;
    primaryStartY = el.y;
    primaryAnchorX = 0;
    primaryAnchorY = 0;
  }
  drag = {
    id: id,
    ids: dragIds,
    ox: (evt.clientX - stageRect.left) / S.stageScale - (el.type==='line' ? el.x1 : el.x),
    oy: (evt.clientY - stageRect.top) / S.stageScale - (el.type==='line' ? el.y1 : el.y),
    primaryStartX: primaryStartX,
    primaryStartY: primaryStartY,
    primaryAnchorX: primaryAnchorX,
    primaryAnchorY: primaryAnchorY,
    origPositions: origPositions
  };
  render();
};

// Connect a screen share element to a live stream.
//
// In packaged Electron: use our custom picker (desktopCapturer + getUserMedia with
// chromeMediaSourceId). We control the UI, thumbnails, refresh, everything.
//
// In browser / dev mode: use getDisplayMedia() which gives Chrome's native picker.
window.connectScreenShare = async function(id, evt){
  if(evt) evt.stopPropagation();

  var stream = null;
  try {
    if(window.epElectron && typeof window.epElectron.listDesktopSources === 'function'){
      // Electron packaged build — always use custom picker
      var source = await showScreenSourcePicker();
      if(!source) return; // user cancelled
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          mandatory: {
            chromeMediaSource: 'desktop',
            chromeMediaSourceId: source.id,
            maxFrameRate: 30
          }
        }
      });
    } else if(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia){
      // Browser / dev mode
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30, max: 60 } },
          audio: false
        });
      } catch(err){
        if(err.name === 'NotAllowedError' || err.name === 'AbortError') return;
        throw err;
      }
    } else {
      showToast('Screen capture not supported');
      return;
    }

    if(!stream) return;

    _screenShareStreams[id] = stream;
    // Auto-disconnect when the track ends (user closes the picker or the shared window)
    var vTrack = stream.getVideoTracks()[0];
    if(vTrack){
      vTrack.addEventListener('ended', function(){
        disconnectScreenShare(id, null, true);
      });
    }
    // Re-render so placeholder is replaced with live video
    if(S.pres) renderPres(); else render();
    // Attach stream to the newly-rendered video element
    setTimeout(function(){
      var v = document.getElementById('ss-video-' + id);
      if(v){ v.srcObject = stream; v.play().catch(function(){}); }
    }, 50);
    showToast('Screen share connected');
  } catch(e){
    console.error('Screen share failed:', e);
    if(e.name === 'NotAllowedError') showToast('Screen share permission denied');
    else showToast('Screen share error: ' + (e.message || e.name || 'unknown'));
  }
};

// Custom screen-source picker for Electron. Shows a modal grid of screens+windows.
// Returns the selected source object (with .id) or null if cancelled.
function showScreenSourcePicker(){
  return new Promise(async function(resolve){
    var sources = [];
    try {
      sources = await window.epElectron.listDesktopSources();
    } catch(e){
      console.error('Failed to list sources:', e);
      showToast('Could not list screens');
      resolve(null);
      return;
    }
    if(!sources || !sources.length){
      showToast('No screens found');
      resolve(null);
      return;
    }

    function buildHTML(){
      var screens = sources.filter(function(s){ return s.id.indexOf('screen:') === 0; });
      var windows = sources.filter(function(s){ return s.id.indexOf('window:') === 0; });
      return '<div class="ep-sp-card">' +
        '<div class="ep-sp-header">' +
          '<h2 class="ep-sp-title">Choose what to share</h2>' +
          '<div class="ep-sp-actions">' +
            '<button class="ep-sp-refresh" data-act="refresh" title="Refresh the source list">↻ Refresh</button>' +
            '<button class="ep-sp-close" data-act="cancel" title="Cancel (Esc)">&times;</button>' +
          '</div>' +
        '</div>' +
        '<div class="ep-sp-body">' +
          (screens.length ? '<div class="ep-sp-section-label">Screens</div><div class="ep-sp-grid">' +
            screens.map(renderSourceTile).join('') + '</div>' : '') +
          (windows.length ? '<div class="ep-sp-section-label">Windows</div><div class="ep-sp-grid">' +
            windows.map(renderSourceTile).join('') + '</div>' : '') +
          '<div class="ep-sp-footnote">Some apps (WhatsApp, Teams, Discord) use private rendering and don\'t appear here. To share one of them, pick the <strong>screen</strong> containing it.</div>' +
        '</div>' +
      '</div>';
    }

    var overlay = document.createElement('div');
    overlay.id = 'ep-source-picker';
    overlay.innerHTML = buildHTML();
    document.body.appendChild(overlay);

    function renderSourceTile(s){
      var safeName = (s.name || 'Untitled').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return '<button class="ep-sp-tile" data-act="pick" data-id="' + s.id + '">' +
        (s.thumbnail ? '<img class="ep-sp-thumb" src="' + s.thumbnail + '" alt="">' : '<div class="ep-sp-thumb empty"></div>') +
        '<div class="ep-sp-name" title="' + safeName + '">' +
          (s.appIcon ? '<img class="ep-sp-icon" src="' + s.appIcon + '">' : '') +
          '<span>' + safeName + '</span>' +
        '</div>' +
      '</button>';
    }

    function done(result){
      overlay.classList.add('closing');
      document.removeEventListener('keydown', keyHandler);
      setTimeout(function(){
        if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
        resolve(result);
      }, 150);
    }

    function keyHandler(e){
      if(e.key === 'Escape'){ e.preventDefault(); done(null); }
    }
    document.addEventListener('keydown', keyHandler);

    overlay.addEventListener('click', async function(e){
      var tile = e.target.closest('[data-act="pick"]');
      if(tile){
        var id = tile.getAttribute('data-id');
        var src = sources.find(function(s){ return s.id === id; });
        done(src || null);
        return;
      }
      if(e.target.closest('[data-act="refresh"]')){
        try {
          var fresh = await window.epElectron.listDesktopSources();
          if(fresh && fresh.length){
            sources = fresh;
            overlay.innerHTML = buildHTML();
          }
        } catch(err){ console.error('Refresh failed:', err); }
        return;
      }
      if(e.target.closest('[data-act="cancel"]') || e.target === overlay){
        done(null);
      }
    });
  });
}

// Connect a webcam element to a live camera stream.
window.connectWebcamEl = async function(id, evt){
  if(evt) evt.stopPropagation();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showToast('Camera not supported'); return;
  }

  // Find the element so we can honour a stored deviceId if present
  var el = null;
  var slide = cs();
  if(slide){
    for(var i=0; i<slide.els.length; i++){
      if(slide.els[i].id === id){ el = slide.els[i]; break; }
    }
  }
  var deviceId = el && el.deviceId ? el.deviceId : null;

  try {
    var constraints = {
      audio: false,
      video: deviceId
        ? { deviceId: { exact: deviceId }, width:{ideal:1280}, height:{ideal:720} }
        : { width:{ideal:1280}, height:{ideal:720}, facingMode: 'user' }
    };
    var stream = await navigator.mediaDevices.getUserMedia(constraints);
    _webcamElStreams[id] = stream;
    // Auto-disconnect if the user disconnects their camera device mid-session
    var vTrack = stream.getVideoTracks()[0];
    if(vTrack){
      vTrack.addEventListener('ended', function(){
        disconnectWebcamEl(id, null, true);
      });
    }
    if(S.pres) renderPres(); else render();
    setTimeout(function(){
      var v = document.getElementById('wc-video-' + id);
      if(v){ v.srcObject = stream; v.play().catch(function(){}); }
    }, 50);
    showToast('Camera connected');
  } catch(e){
    console.error('Camera failed:', e);
    if(e.name === 'NotAllowedError') showToast('Camera permission denied');
    else if(e.name === 'NotFoundError') showToast('No camera found');
    else showToast('Camera error: ' + (e.message || e.name));
  }
};

window.disconnectWebcamEl = function(id, evt, silent){

  }

// List available video input devices for the dropdown picker
window.listWebcamDevices = async function(){
  try {
    // enumerateDevices returns labels only after permission granted,
    // so prompt + immediately release if we don't already have a stream
    if(!navigator.mediaDevices) return [];
    var devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(function(d){ return d.kind === 'videoinput'; });
  } catch(e){ return []; }
};

// Switch camera device for a specific webcam element. Reconnects with new device.
window.switchWebcamDevice = async function(id, deviceId){
  updateEl(id, {deviceId: deviceId});
  // Tear down current stream
  var old = _webcamElStreams[id];
  if(old){ try { old.getTracks().forEach(function(t){ t.stop(); }); } catch(e){} }
  delete _webcamElStreams[id];
  // Reconnect (connectWebcamEl reads the saved deviceId from the element)
  await connectWebcamEl(id);
};

// Re-attach active webcam streams to their video elements after re-render
function reattachWebcamStreams(){
  var ids = Object.keys(_webcamElStreams);
  for(var i=0; i<ids.length; i++){
    var id = ids[i];
    var v = document.getElementById('wc-video-' + id);
    if(v && _webcamElStreams[id] && v.srcObject !== _webcamElStreams[id]){
      v.srcObject = _webcamElStreams[id];
      v.play().catch(function(){});
    }
  }
}

// Populate the camera-device dropdown for a specific webcam element's props panel.
// Called after render; reads enumerated devices and populates the container.
async function populateWebcamDeviceList(elId){
  var container = document.getElementById('wc-devices-' + elId);
  if(!container) return;
  try {
    var devs = await listWebcamDevices();
    if(!devs || !devs.length){ container.innerHTML = ''; return; }
    // Find current element's deviceId
    var currentDeviceId = '';
    var slide = cs();
    if(slide){
      for(var i=0; i<slide.els.length; i++){
        if(slide.els[i].id === elId){ currentDeviceId = slide.els[i].deviceId || ''; break; }
      }
    }
    var html = '<div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Camera Device</div>';
    html += '<select class="pr-i" style="width:100%" onchange="switchWebcamDevice(\''+elId+'\',this.value)">';
    devs.forEach(function(d, idx){
      var sel = d.deviceId === currentDeviceId;
      var label = (d.label || 'Camera ' + (idx + 1)).replace(/</g,'&lt;').replace(/>/g,'&gt;');
      html += '<option value="'+d.deviceId+'"'+(sel?' selected':'')+'>'+label+'</option>';
    });
    html += '</select>';
    container.innerHTML = html;
  } catch(e){ console.error('populateWebcamDeviceList:', e); }
}

// Mount a TradingView widget into its element container.
// Each widget type has its own embed pattern.
function mountTradingViewWidget(elId){
  var container = document.getElementById('tv-container-' + elId);
  if(!container) return;
  // Find element config
  var slide = cs();
  var el = null;
  if(slide){
    for(var i=0; i<slide.els.length; i++){
      if(slide.els[i].id === elId){ el = slide.els[i]; break; }
    }
  }
  // Also check across pres slide if not found on current
  if(!el && S.pres){
    var pslide = S.slides[S.presSlide];
    if(pslide){
      for(var pi=0; pi<pslide.els.length; pi++){
        if(pslide.els[pi].id === elId){ el = pslide.els[pi]; break; }
      }
    }
  }
  if(!el) return;

  // Clear existing content
  container.innerHTML = '';

  var iframe = document.createElement('iframe');
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = '0';
  iframe.style.display = 'block';
  iframe.setAttribute('allowtransparency', 'true');
  iframe.setAttribute('scrolling', 'no');
  iframe.setAttribute('frameborder', '0');
  iframe.src = 'about:blank';
  container.appendChild(iframe);

  // Once blank page is ready, inject our content via innerHTML.
  // This avoids srcdoc escaping and doc.write quirks.
  var setupWidget = function(){
    try {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      if(!doc) return;
      var html = buildTradingViewIframeHtml(el);
      doc.open();
      doc.write(html);
      doc.close();
      // Hide loader after a short grace period (TV script needs to boot)
      var parent = container.parentElement;
      if(parent){
        var loader = parent.querySelector('.tv-loading');
        if(loader) setTimeout(function(){ loader.style.display = 'none'; }, 1500);
      }
    } catch(e){
      console.error('[EP] TradingView iframe mount failed:', e);
    }
  };
  // Delay to ensure about:blank has loaded
  setTimeout(setupWidget, 50);
}

// Compute a spawn position for a new element on the current slide.
// Returns {x, y} that cascades down-and-right based on existing element count,
// so successive adds don't perfectly stack. Wraps after 12 elements to stay on canvas.
// `w` / `h` are the new element's dimensions so we can center the cascade origin.
function getNextSpawnPos(w, h){
  var slide = cs();
  var n = (slide && slide.els) ? slide.els.length : 0;
  // Wrap after 12 elements so we don't drift off-screen
  var step = n % 12;
  // Base position: roughly 1/4 in from top-left of stage so cascade has room to grow
  var baseX = 240, baseY = 160;
  var dx = step * 35;
  var dy = step * 30;
  var x = baseX + dx;
  var y = baseY + dy;
  // Clamp inside stage so it's always visible
  if(w && x + w > STAGE_W - 20) x = Math.max(20, STAGE_W - w - 20);
  if(h && y + h > STAGE_H - 20) y = Math.max(20, STAGE_H - h - 20);
  return { x: x, y: y };
}
window.getNextSpawnPos = getNextSpawnPos;

window.setListStyle = function(id, style){

  // Create a new list of the target style, preserve items where shape matches
  var newEl = mkList(style, el.x, el.y);
  newEl.id = el.id;
  newEl.w = el.w;
  newEl.h = el.h;
  newEl.lk = el.lk;
  // Preserve existing items if structurally compatible
  if(el.items && el.items.length && style !== 'table'){
    // Map items from whatever they were into new format where possible
    if(style === 'checklist'){
      newEl.items = el.items.map(function(it){
        return {id:uid(), text: it.text || it.title || it.body || 'Item', checked: it.checked || false};
      });
    } else if(style === 'stacked-card' || style === 'timeline'){
      var defaultColors = ['#7ed957','#ffa500','#3b82f6','#a855f7','#ec4899','#f43f5e'];
      newEl.items = el.items.map(function(it, i){
        return {id:uid(), title: it.title || it.text || 'Title', body: it.body || '', color: it.color || defaultColors[i % defaultColors.length]};
      });
    }
  }
  updateSlide(function(s){
    s.els = s.els.map(function(e){return e.id === id ? newEl : e});

  });

window.addListItem = function(id){

  if(el.style === 'stacked-card' || el.style === 'timeline'){
    newItem = {id:uid(), title:'New item', body:'Description', color:accentColors[el.items.length % accentColors.length]};
  } else if(el.style === 'checklist'){
    newItem = {id:uid(), text:'New item', checked:false};
  } else if(el.style === 'table'){
    var cols = (el.headers && el.headers.length) || (el.items[0] && el.items[0].cells.length) || 3;

// =========================================================
// ELEMENT GROUPS
// =========================================================
// Groups are represented by a `gid` field on each element. Elements sharing the
// same gid form a group. There is no separate groups array — membership is
// implicit. Selecting any member auto-selects all members.

// Find all element IDs that share a gid with the given id.
function getGroupMemberIds(id){
  var slide = cs(); if(!slide) return [id];
  var el = gEl(id);
  if(!el || !el.gid) return [id];
  return slide.els.filter(function(e){ return e.gid === el.gid; }).map(function(e){ return e.id; });
}
window.getGroupMemberIds = getGroupMemberIds;

// Expand a selection to include all group siblings of any selected element.
function expandSelectionToGroups(ids){
  var slide = cs(); if(!slide) return ids;
  var gidsTouched = {};
  ids.forEach(function(id){
    var el = gEl(id);
    if(el && el.gid) gidsTouched[el.gid] = true;
  });
  var seen = {};
  var out = [];
  ids.forEach(function(id){ if(!seen[id]){ seen[id] = true; out.push(id); } });
  slide.els.forEach(function(e){
    if(e.gid && gidsTouched[e.gid] && !seen[e.id]){
      seen[e.id] = true;
      out.push(e.id);
    }
  });
  return out;
}
window.expandSelectionToGroups = expandSelectionToGroups;

// Group the currently-selected elements. Assigns them a fresh gid.
window.groupSelection = function(){
  if(S.selIds.length < 2){ showToast('Select 2 or more elements to group'); return; }
  var newGid = 'g_' + uid();
  updateSlide(function(s){
    s.els.forEach(function(e){
      if(S.selIds.indexOf(e.id) >= 0){ e.gid = newGid; }
    });
    return s;
  });
  showToast('Grouped ' + S.selIds.length + ' elements');
};

// Ungroup: remove gid from every selected element (and from any of their group siblings).
window.ungroupSelection = function(){
  if(!S.selIds.length){ showToast('Nothing selected'); return; }
  var slide = cs(); if(!slide) return;
  // Find all gids represented in current selection
  var gids = {};
  S.selIds.forEach(function(id){
    var el = gEl(id);
    if(el && el.gid) gids[el.gid] = true;
  });
  if(Object.keys(gids).length === 0){ showToast('No groups in selection'); return; }
  updateSlide(function(s){
    s.els.forEach(function(e){
      if(e.gid && gids[e.gid]) delete e.gid;
    });
    return s;
  });
  showToast('Ungrouped');
};

// Get the bounding box of a group (min/max x/y of all members).
function getGroupBounds(gid){
  var slide = cs(); if(!slide) return null;
  var members = slide.els.filter(function(e){ return e.gid === gid; });
  if(!members.length) return null;
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  members.forEach(function(e){
    var x1, y1, x2, y2;
    if(e.type === 'line'){
      x1 = Math.min(e.x1, e.x2); y1 = Math.min(e.y1, e.y2);
      x2 = Math.max(e.x1, e.x2); y2 = Math.max(e.y1, e.y2);
    } else {
      x1 = e.x; y1 = e.y;
      x2 = e.x + (e.w || 0); y2 = e.y + (e.h || 0);
    }
    if(x1 < minX) minX = x1;
    if(y1 < minY) minY = y1;
    if(x2 > maxX) maxX = x2;
    if(y2 > maxY) maxY = y2;
  });
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}
window.getGroupBounds = getGroupBounds;

// =========================================================
// ALIGNMENT
// =========================================================
function getElBounds(el){
  if(el.type === 'line'){
    return {
      x: Math.min(el.x1, el.x2),
      y: Math.min(el.y1, el.y2),
      w: Math.abs(el.x2 - el.x1),
      h: Math.abs(el.y2 - el.y1)
    };
  }
  return {x:el.x||0, y:el.y||0, w:el.w||0, h:el.h||0};
}

function moveElTo(el, newX, newY){
  var b = getElBounds(el);
  var dx = newX - b.x, dy = newY - b.y;
  if(el.type === 'line'){
    el.x1 += dx; el.y1 += dy; el.x2 += dx; el.y2 += dy;
  } else {
    el.x += dx; el.y += dy;
  }
}

window.alignSelection = function(mode){
  if(S.selIds.length < 1) return;
  // Detect if the entire selection is exactly one group — if so, alignment should
  // treat the group as a single object (move the whole group, preserve relative
  // positions of children). Otherwise members would all collapse to share the
  // same edge/center, which is destructive.
  var isWholeGroup = false;
  if(S.selIds.length >= 2){
    var slide0 = cs();
    if(slide0){
      var firstEl = gEl(S.selIds[0]);
      var firstGid = firstEl ? firstEl.gid : null;
      if(firstGid){
        // All selected must be in this gid AND the group must have no other members
        var allInGid = S.selIds.every(function(id){
          var e = gEl(id);
          return e && e.gid === firstGid;
        });
        var groupSize = slide0.els.filter(function(e){ return e.gid === firstGid; }).length;
        if(allInGid && groupSize === S.selIds.length) isWholeGroup = true;
      }
    }
  }

  updateSlide(function(s){
    var selected = s.els.filter(function(e){return S.selIds.indexOf(e.id) >= 0 && !e.lk});
    if(!selected.length) return s;

    // Whole-group alignment: shift all members by the same delta so the group
    // moves as one. Reference is the stage (or for distribute, no-op).
    if(isWholeGroup){
      // Compute group bounds
      var bnds = selected.map(getElBounds);
      var gx = Math.min.apply(null, bnds.map(function(b){return b.x}));
      var gy = Math.min.apply(null, bnds.map(function(b){return b.y}));
      var gxMax = Math.max.apply(null, bnds.map(function(b){return b.x+b.w}));
      var gyMax = Math.max.apply(null, bnds.map(function(b){return b.y+b.h}));
      var gw = gxMax - gx, gh = gyMax - gy;
      var dx = 0, dy = 0;
      if(mode === 'left')    dx = 0 - gx;
      if(mode === 'right')   dx = (STAGE_W - gw) - gx;
      if(mode === 'hcenter') dx = ((STAGE_W - gw)/2) - gx;
      if(mode === 'top')     dy = 0 - gy;
      if(mode === 'bottom')  dy = (STAGE_H - gh) - gy;
      if(mode === 'vcenter') dy = ((STAGE_H - gh)/2) - gy;
      // dist-h / dist-v are no-ops on a single group (can't distribute one thing)
      if(dx !== 0 || dy !== 0){
        selected.forEach(function(el){
          var b = getElBounds(el);
          moveElTo(el, b.x + dx, b.y + dy);
        });
      }
      return s;
    }

    // Standard alignment: align members of selection to each other (or to stage if 1 selected)
    var refX, refY, refW, refH;
    if(selected.length === 1){
      refX = 0; refY = 0; refW = STAGE_W; refH = STAGE_H;
    } else {
      var bounds = selected.map(getElBounds);
      refX = Math.min.apply(null, bounds.map(function(b){return b.x}));
      refY = Math.min.apply(null, bounds.map(function(b){return b.y}));
      var maxX = Math.max.apply(null, bounds.map(function(b){return b.x+b.w}));
      var maxY = Math.max.apply(null, bounds.map(function(b){return b.y+b.h}));
      refW = maxX - refX; refH = maxY - refY;
    }
    selected.forEach(function(el){
      var b = getElBounds(el);
      if(mode === 'left') moveElTo(el, refX, b.y);
      if(mode === 'right') moveElTo(el, refX + refW - b.w, b.y);
      if(mode === 'hcenter') moveElTo(el, refX + (refW - b.w)/2, b.y);
      if(mode === 'top') moveElTo(el, b.x, refY);
      if(mode === 'bottom') moveElTo(el, b.x, refY + refH - b.h);
      if(mode === 'vcenter') moveElTo(el, b.x, refY + (refH - b.h)/2);
    });
    // Distribute (only makes sense with 3+)
    if((mode === 'dist-h' || mode === 'dist-v') && selected.length >= 3){
      var axis = mode === 'dist-h' ? 'x' : 'y';
      var size = mode === 'dist-h' ? 'w' : 'h';
      var sorted = selected.slice().sort(function(a,b){return getElBounds(a)[axis] - getElBounds(b)[axis]});
      var first = getElBounds(sorted[0]), last = getElBounds(sorted[sorted.length-1]);
      var totalSpace = (last[axis] + last[size]) - first[axis];
      var totalSize = sorted.reduce(function(sum,e){return sum + getElBounds(e)[size]}, 0);
      var gap = (totalSpace - totalSize) / (sorted.length - 1);
      var cursor = first[axis] + first[size] + gap;
      for(var i=1; i<sorted.length-1; i++){
        var el = sorted[i];
        if(axis === 'x') moveElTo(el, cursor, getElBounds(el).y);
        else moveElTo(el, getElBounds(el).x, cursor);
        cursor += getElBounds(el)[size] + gap;
      }
    }
    return s;
  });
};

// =========================================================
// SNAP-TO-GRID & ALIGNMENT GUIDES
// =========================================================
var SNAP_THRESHOLD = 10; // pixels at stage scale (was 6, too tight)
var GRID_SIZE = 20;

window.toggleSnap = function(){
  S.snapEnabled = !S.snapEnabled;
  render();
};

function computeSnap(movingIds, proposedDx, proposedDy){
  if(!S.snapEnabled) return {dx:proposedDx, dy:proposedDy, guides:[]};
  var slide = cs();
  var moving = slide.els.filter(function(e){return movingIds.indexOf(e.id) >= 0});
  var others = slide.els.filter(function(e){return movingIds.indexOf(e.id) < 0});
  if(!moving.length) return {dx:proposedDx, dy:proposedDy, guides:[]};

  // Bounding box of moving elements (already moved by proposed delta)
  var bounds = moving.map(function(el){
    var b = getElBounds(el);
    return {x:b.x+proposedDx, y:b.y+proposedDy, w:b.w, h:b.h};
  });
  var mx1 = Math.min.apply(null, bounds.map(function(b){return b.x}));
  var my1 = Math.min.apply(null, bounds.map(function(b){return b.y}));
  var mx2 = Math.max.apply(null, bounds.map(function(b){return b.x+b.w}));
  var my2 = Math.max.apply(null, bounds.map(function(b){return b.y+b.h}));
  var mcx = (mx1+mx2)/2, mcy = (my1+my2)/2;

  // Candidate snap points: other element edges/centers + stage edges/center
  var xTargets = [0, STAGE_W/2, STAGE_W];
  var yTargets = [0, STAGE_H/2, STAGE_H];
  others.forEach(function(el){
    var b = getElBounds(el);
    xTargets.push(b.x, b.x+b.w/2, b.x+b.w);
    yTargets.push(b.y, b.y+b.h/2, b.y+b.h);
  });

  var threshold = SNAP_THRESHOLD / S.stageScale;
  var bestX = null, bestY = null;
  var guides = [];

  // Try snap: left edge, center, right edge of moving -> each xTarget
  xTargets.forEach(function(tx){
    [[mx1,'l'], [mcx,'c'], [mx2,'r']].forEach(function(pair){
      var d = tx - pair[0];
      if(Math.abs(d) < threshold){
        if(!bestX || Math.abs(d) < Math.abs(bestX.d)){
          bestX = {d:d, tx:tx};
        }
      }
    });
  });
  yTargets.forEach(function(ty){
    [[my1,'t'], [mcy,'c'], [my2,'b']].forEach(function(pair){
      var d = ty - pair[0];
      if(Math.abs(d) < threshold){
        if(!bestY || Math.abs(d) < Math.abs(bestY.d)){
          bestY = {d:d, ty:ty};
        }
      }
    });
  });

  var finalDx = proposedDx + (bestX ? bestX.d : 0);
  var finalDy = proposedDy + (bestY ? bestY.d : 0);

  if(bestX) guides.push({type:'v', x:bestX.tx});
  if(bestY) guides.push({type:'h', y:bestY.ty});

  return {dx:finalDx, dy:finalDy, guides:guides};
}

function showToast(msg){
  var existing = document.getElementById('epToast');
  if(existing) existing.remove();
  var t = document.createElement('div');
  t.id = 'epToast';
  t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(22,22,28,0.95);backdrop-filter:blur(10px);color:var(--w);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;border:1px solid var(--brd);box-shadow:0 8px 24px rgba(0,0,0,0.4);animation:popIn 0.2s ease';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){
    t.style.transition = 'opacity 0.3s';
    t.style.opacity = '0';
    setTimeout(function(){t.remove()}, 300);
  }, 1800);
}

// Slide change transition (between slides) + reveal animation (when reveal-step advances)

var TRANSITION_OPTIONS = [
  {v:'fade', l:'Fade'},
  {v:'slide-left', l:'Slide Left'},
  {v:'slide-right', l:'Slide Right'},
  {v:'slide-up', l:'Slide Up'},
  {v:'slide-down', l:'Slide Down'},
  {v:'zoom', l:'Zoom In'},
  {v:'zoom-out', l:'Zoom Out'},
  {v:'none', l:'None'}
];
var REVEAL_ANIM_OPTIONS = [
  {v:'fade', l:'Fade'},
  {v:'slide-up', l:'Slide Up'},
  {v:'slide-left', l:'Slide Left'},
  {v:'slide-right', l:'Slide Right'},
  {v:'zoom', l:'Zoom In'},
  {v:'pop', l:'Pop'},
  {v:'none', l:'None'}
];
var GLOBAL_TRANS_KEY = 'ep-presenter-global-transition';
var GLOBAL_REVEAL_KEY = 'ep-presenter-global-reveal-anim';
var GLOBAL_SPEED_KEY = 'ep-presenter-global-speed';
try {
  S.globalTransition = localStorage.getItem(GLOBAL_TRANS_KEY) || 'fade';
  S.globalRevealAnim = localStorage.getItem(GLOBAL_REVEAL_KEY) || 'fade';
  S.globalSpeed = localStorage.getItem(GLOBAL_SPEED_KEY) || 'normal';
} catch(e){ S.globalTransition = 'fade'; S.globalRevealAnim = 'fade'; S.globalSpeed = 'normal'; }

// Apply speed class to body so CSS variables take effect
function applyGlobalSpeed(){
  if(!document.body) return;
  document.body.classList.remove('ep-speed-fast','ep-speed-normal','ep-speed-slow');
  document.body.classList.add('ep-speed-' + (S.globalSpeed || 'normal'));
}
// Apply on init (DOMContentLoaded already fired by the time this runs)
if(document.body) applyGlobalSpeed();
else document.addEventListener('DOMContentLoaded', applyGlobalSpeed);

window.setGlobalTransition = function(t){
  S.globalTransition = t;
  try { localStorage.setItem(GLOBAL_TRANS_KEY, t); } catch(e){}
  showToast('Default slide transition: ' + (TRANSITION_OPTIONS.find(function(x){return x.v===t})||{l:t}).l);
};
window.setGlobalRevealAnim = function(t){
  S.globalRevealAnim = t;
  try { localStorage.setItem(GLOBAL_REVEAL_KEY, t); } catch(e){}
  showToast('Reveal animation: ' + (REVEAL_ANIM_OPTIONS.find(function(x){return x.v===t})||{l:t}).l);
};

};
window.setSlideTransition = function(t){

};

// =========================================================
// SLIDE AUDIO (per-slide voiceovers)
// =========================================================
// Each slide can carry an optional audio object:
//   slide.audio = {
//     data: 'data:audio/mp3;base64,...',  // the encoded audio
//     name: 'voiceover-1.mp3',            // original filename (for display)
//     autoplay: true,                     // play on slide open
//     autoadvance: false,                 // jump to next slide when audio ends
//     showControls: true                  // show play/pause UI on slide
//   }
// We keep ONE active <audio> element to avoid memory leaks. State is tracked in
// _slideAudio so we can stop/swap cleanly when slides change.
var _slideAudio = { audio: null, slideId: null };

// Stop and discard the current playing audio (used on slide change / exit pres).
function stopSlideAudio(){
  if(_slideAudio.audio){
    try { _slideAudio.audio.pause(); _slideAudio.audio.src = ''; _slideAudio.audio.load(); } catch(e){}
  }
  _slideAudio.audio = null;
  _slideAudio.slideId = null;
}

// Play the audio attached to a given slide. If the same slide is already playing,
// no-op. If no audio attached, no-op.
function playSlideAudio(slide){
  if(!slide || !slide.audio || !slide.audio.data) return;
  // Already playing for this slide?
  if(_slideAudio.slideId === slide.id && _slideAudio.audio && !_slideAudio.audio.ended){
    return;
  }
  stopSlideAudio();
  var a = new Audio(slide.audio.data);
  _slideAudio.audio = a;
  _slideAudio.slideId = slide.id;

  // If we're recording AND the user opted to include slide audio, route through mixer.
  // This lets the recorded webm capture the voiceover in sync with the visuals.
  if(S.recActive && S.recRouteSlideAudio && S.recAudioCtx && S.recAudioDest){
    try {
      var srcNode = S.recAudioCtx.createMediaElementSource(a);
      srcNode.connect(S.recAudioDest);
      // Also keep audible output to speakers
      srcNode.connect(S.recAudioCtx.destination);
    } catch(e){
      // createMediaElementSource throws if already connected; just log
      console.warn('Slide audio routing failed:', e);
    }
  }

  // Autoadvance: when audio ends, advance presentation
  a.addEventListener('ended', function(){
    if(slide.audio.autoadvance && S.pres && S.presSlide < S.slides.length - 1){
      // Only advance if user hasn't already moved on
      if(_slideAudio.slideId === slide.id){
        if(typeof window.presNext === 'function') window.presNext();
      }
    }
  });
  a.play().catch(function(err){
    console.warn('Slide audio play failed:', err);
  });
}

// Toggle pause/resume on the current slide's audio (called from controls UI).
window.toggleSlideAudio = function(){
  var a = _slideAudio.audio;
  if(!a) return;
  if(a.paused) a.play().catch(function(){});
  else a.pause();
  // Re-render to update icon
  if(S.pres) renderPres();
};

// File picker → reads selected audio file → stores as base64 data URL on the slide.
window.uploadSlideAudio = function(slideIdx){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'audio/*';
  inp.onchange = function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    // Cap at 25 MB to keep deck files manageable
    if(file.size > 25 * 1024 * 1024){
      showToast('Audio file too large (max 25 MB)');
      return;
    }
    var r = new FileReader();
    r.onload = function(){
      var slide = (slideIdx != null) ? S.slides[slideIdx] : cs();
      if(!slide) return;
      slide.audio = {
        data: r.result,
        name: file.name,
        autoplay: true,
        autoadvance: false,
        showControls: true
      };
      pushHist();
      render();
      showToast('Audio attached: ' + file.name);
    };
    r.onerror = function(){ showToast('Could not read audio file'); };
    r.readAsDataURL(file);
  };
  inp.click();
};

window.removeSlideAudio = function(slideIdx){
  var slide = (slideIdx != null) ? S.slides[slideIdx] : cs();
  if(!slide || !slide.audio) return;
  delete slide.audio;
  if(_slideAudio.slideId === slide.id) stopSlideAudio();
  pushHist();
  render();
  showToast('Audio removed');
};

window.toggleSlideAudioSetting = function(setting){
  var slide = cs();
  if(!slide || !slide.audio) return;
  slide.audio[setting] = !slide.audio[setting];
  pushHist();
  render();
};
// Resolve effective transition for a slide (slide override > global default)
function getEffectiveTransition(slide){
  if(!slide) return S.globalTransition || 'fade';
  return slide.transition || S.globalTransition || 'fade';
}

function autoSave(){
  if(!S.autoSaveEnabled) return;
  if(autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(function(){
    try {
      var data = {slides:S.slides, si:S.si, v:4, savedAt:Date.now()};
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(data));
      lastAutoSaveAt = Date.now();
      var ind = document.getElementById('autosaveInd');
      if(ind){
        ind.textContent = 'Saved';
        ind.style.color = 'var(--g)';
        setTimeout(function(){ if(ind) ind.textContent = S.autoSaveEnabled ? 'Auto-save on' : 'Auto-save OFF'; }, 1500);
      }
    } catch(e){
      console.warn('Autosave failed:', e);
    }
  }, AUTOSAVE_DEBOUNCE_MS);
}

function loadAutoSave(){
  try {
    var raw = localStorage.getItem(AUTOSAVE_KEY);
    if(!raw) return null;
    var data = JSON.parse(raw);
    if(!data.slides || !data.slides.length) return null;
    return data;
  } catch(e){ return null; }
}

window.toggleAutoSave = function(){
  S.autoSaveEnabled = !S.autoSaveEnabled;
  try { localStorage.setItem(AUTOSAVE_PREF_KEY, String(S.autoSaveEnabled)); } catch(e){}
  if(!S.autoSaveEnabled){
    // Cancel any pending save
    if(autosaveTimer) clearTimeout(autosaveTimer);
  }
  showToast('Auto-save ' + (S.autoSaveEnabled ? 'enabled' : 'disabled'));
  render();
};

window.manualSave = function(){
  // Force immediate save regardless of toggle
  if(autosaveTimer) clearTimeout(autosaveTimer);
  try {
    var data = {slides:S.slides, si:S.si, v:4, savedAt:Date.now()};
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(data));
    showToast('Saved to browser');
  } catch(e){
    showToast('Save failed: ' + e.message);
  }
};

window.clearAutoSave = function(){
  if(confirm('Clear auto-saved draft? This cannot be undone.')){
    localStorage.removeItem(AUTOSAVE_KEY);
    showToast('Auto-save cleared');
  }
};
